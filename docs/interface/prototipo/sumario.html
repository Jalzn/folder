<title>Tinyfold Sumário</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* Sumário, camada visual v3 (visual.md): tokens gerados em OKLCH (base h 262, acento anil h 268, contraste 60), Inter com corte display nos títulos,
   grade de 4 px, raios por papel, elevação por luminosidade no escuro e por fio e sombra mínima no claro. Estrutura e fluxos iguais à v2. */
:root {
  color-scheme: light;
  --lateral: #F5F7FA; --fundo: #FDFDFE; --nivel-1: #FFFFFF; --nivel-2: #FFFFFF; --nivel-3: #FFFFFF; --hover: #F0F2F5; --hover-nivel: #F2F3F7;
  --ativo: #E9EBEF; --selecao: #E8EEFF; --fio: #E1E3E6; --fio-forte: #CFD1D4; --borda-campo: #8A8C8F; --texto: #18191C; --texto-2: #47494C;
  --texto-3: #636568; --icone: #595B5E; --acento: #3856C8; --acento-solido: #3856C8; --acento-solido-hover: #2F4ABA; --sobre-acento: #FFFFFF;
  --atraso: #C22826; --atraso-bg: #FEF0EE; --ok: #21763C; --ok-bg: #E8F9EB; --aviso: #8F5A04; --aviso-bg: #FFF4E2; --conflito: #982F93;
  --conflito-bg: #FDEEFB; --perigo: #C22826; --toast: #202224; --sobre-toast: #F8FAFE; --acento-25: rgb(56 86 200 / .25);
  --acento-35: rgb(56 86 200 / .35); --sel-texto: rgb(56 86 200 / .22); --veu: rgb(16 18 27 / .18); --sombra-card: 0 1px 0 rgb(16 18 27 / .04);
  --sombra-card-hover: 0 1px 3px rgb(16 18 27 / .08); --sombra: 0 4px 16px rgb(16 18 27 / .08), 0 1px 3px rgb(16 18 27 / .06);
  --sombra-gaveta: 0 -8px 24px rgb(16 18 27 / .08); --luz: 0 0 #0000; --w-ui: 400; --card-hover: #FFFFFF; --barra-a-fundo: #F2F4F9;
  --barra-a-hover: #E9EBEF; --barra-a-ativo: #E3E5EA; --campo-b: #F0F2F5; --lb-mcp: #1577C8; --lb-backend: #6B7587; --lb-editor: #835CBE;
  --lb-kanban: #048681; --lb-operacao: #A06604; --lb-fornecedores: #BA4E25; --lb-compras: #4A871B; --mk-violeta-bg: #EEE7FF;
  --mk-violeta-fg: #68449C; --mk-ocre-bg: #FBE8D3; --mk-ocre-fg: #7E4F04; --mk-cinza-bg: #E5E8ED; --mk-cinza-fg: #474D58; --mk-verde-bg: #DCF2DF;

  --f-ui: 'Inter', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --f-mono: 'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
  --ease: cubic-bezier(.2, .8, .2, 1);
  --sbw: 256px;
  --toast-b: 16px;
  --aba-sublinhado: var(--acento); --marcador: var(--acento);
  --sbw-open: 256px;
}

  :root:not([data-theme="light"]):not([data-tf-theme="light"]) {
    color-scheme: dark;
    --lateral: #0E1116; --fundo: #13161C; --nivel-1: #191D22; --nivel-2: #1F2228; --nivel-3: #24272D; --hover: #1C1F25; --hover-nivel: #25292E;
    --ativo: #23262C; --selecao: #202941; --fio: #2B2E34; --fio-forte: #383C42; --borda-campo: #6F737A; --texto: #ECF0F8; --texto-2: #BEC3CA;
    --texto-3: #9A9FA6; --icone: #ADB1B9; --acento: #86A5FB; --acento-solido: #4B6BD4; --acento-solido-hover: #4260C8; --sobre-acento: #FAFCFF;
    --atraso: #F98078; --atraso-bg: #3D1D1B; --ok: #6AD18A; --ok-bg: #152E1C; --aviso: #F2B95A; --aviso-bg: #342611; --conflito: #E38FDB;
    --conflito-bg: #352033; --perigo: #CA3638; --toast: #2B2E34; --sobre-toast: #EDF2FA; --acento-25: rgb(134 165 251 / .25);
    --acento-35: rgb(134 165 251 / .35); --sel-texto: rgb(134 165 251 / .30); --veu: rgb(4 6 10 / .55); --sombra-card: 0 0 #0000;
    --sombra-card-hover: 0 0 #0000; --sombra: 0 8px 24px rgb(0 0 0 / .45); --sombra-gaveta: 0 -12px 32px rgb(0 0 0 / .40);
    --luz: inset 0 1px 0 rgb(255 255 255 / .05); --w-ui: 450; --card-hover: #25292E; --barra-a-fundo: #0E1116; --barra-a-hover: #161A1F;
    --barra-a-ativo: #1D2126; --campo-b: #191D22; --lb-mcp: #6FB6FE; --lb-backend: #A7B2C5; --lb-editor: #BE9DF7; --lb-kanban: #0DCBC3;
    --lb-operacao: #E5A14B; --lb-fornecedores: #F69370; --lb-compras: #8CC36D; --mk-violeta-bg: #382B4D; --mk-violeta-fg: #C2A7F4;
    --mk-ocre-bg: #462D0B; --mk-ocre-fg: #E5AB66; --mk-cinza-bg: #31363D; --mk-cinza-fg: #B7BECB; --mk-verde-bg: #193B22; --mk-verde-fg: #82CB92;
  }
}
:root[data-theme="dark"]:not([data-tf-theme="light"]), :root[data-tf-theme="dark"] {
  color-scheme: dark;
  --lateral: #0E1116; --fundo: #13161C; --nivel-1: #191D22; --nivel-2: #1F2228; --nivel-3: #24272D; --hover: #1C1F25; --hover-nivel: #25292E;
  --ativo: #23262C; --selecao: #202941; --fio: #2B2E34; --fio-forte: #383C42; --borda-campo: #6F737A; --texto: #ECF0F8; --texto-2: #BEC3CA;
  --texto-3: #9A9FA6; --icone: #ADB1B9; --acento: #86A5FB; --acento-solido: #4B6BD4; --acento-solido-hover: #4260C8; --sobre-acento: #FAFCFF;
  --atraso: #F98078; --atraso-bg: #3D1D1B; --ok: #6AD18A; --ok-bg: #152E1C; --aviso: #F2B95A; --aviso-bg: #342611; --conflito: #E38FDB;
  --conflito-bg: #352033; --perigo: #CA3638; --toast: #2B2E34; --sobre-toast: #EDF2FA; --acento-25: rgb(134 165 251 / .25);
  --acento-35: rgb(134 165 251 / .35); --sel-texto: rgb(134 165 251 / .30); --veu: rgb(4 6 10 / .55); --sombra-card: 0 0 #0000;
  --sombra-card-hover: 0 0 #0000; --sombra: 0 8px 24px rgb(0 0 0 / .45); --sombra-gaveta: 0 -12px 32px rgb(0 0 0 / .40);
  --luz: inset 0 1px 0 rgb(255 255 255 / .05); --w-ui: 450; --card-hover: #25292E; --barra-a-fundo: #0E1116; --barra-a-hover: #161A1F;
  --barra-a-ativo: #1D2126; --campo-b: #191D22; --lb-mcp: #6FB6FE; --lb-backend: #A7B2C5; --lb-editor: #BE9DF7; --lb-kanban: #0DCBC3;
  --lb-operacao: #E5A14B; --lb-fornecedores: #F69370; --lb-compras: #8CC36D; --mk-violeta-bg: #382B4D; --mk-violeta-fg: #C2A7F4;
  --mk-ocre-bg: #462D0B; --mk-ocre-fg: #E5AB66; --mk-cinza-bg: #31363D; --mk-cinza-fg: #B7BECB; --mk-verde-bg: #193B22; --mk-verde-fg: #82CB92;
}

*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body { margin: 0; background: var(--fundo); color: var(--texto); font: var(--w-ui) 13px/20px var(--f-ui); letter-spacing: -.003em; font-feature-settings: "cv05", "ss03", "calt"; font-optical-sizing: auto; overflow: hidden; -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }
button, input, textarea, select { font: inherit; color: inherit; letter-spacing: inherit; }
button { background: none; border: 0; padding: 0; cursor: pointer; text-align: inherit; }
a { color: var(--acento); }
::selection { background: var(--sel-texto); }
:focus { outline: none; }
:focus-visible { outline: 2px solid var(--acento); outline-offset: 2px; }
h1[tabindex="-1"]:focus, h1[tabindex="-1"]:focus-visible, .screen:focus, .editor:focus, .drawer:focus, .sidebar:focus { outline: none; }
h1, h2, h3, p, ul, ol, dl, dd, figure, blockquote, pre { margin: 0; }
ul, ol { padding: 0; list-style: none; }
b, strong { font-weight: 600; }
.t2 { color: var(--texto-2); }
.t3 { color: var(--texto-3); }
.ico { color: var(--icone); }
.late-t { color: var(--atraso); }
.num, .meta, .cnt, .sb-count, .r, .bcount, kbd { font-variant-numeric: tabular-nums; }
.ic { flex: none; display: block; }
.sr-only { position: absolute !important; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
/* tecla: o mesmo quadrado arredondado das marcas, etiquetas e checkbox */
kbd { display: inline-grid; place-items: center; height: 18px; min-width: 18px; padding: 0 4px; border-radius: 4px; background: var(--nivel-1); border: 1px solid var(--fio); box-shadow: inset 0 -1px 0 var(--fio-forte); font: 500 11px/14px var(--f-ui); letter-spacing: .005em; font-feature-settings: "cv05", "ss03", "case", "tnum"; color: var(--texto-3); white-space: nowrap; }
.sc { font: 500 12px/16px var(--f-ui); letter-spacing: 0; color: var(--texto-3); }
/* barras de rolagem finas, só visíveis no hover */
* { scrollbar-width: thin; scrollbar-color: transparent transparent; }
*:hover { scrollbar-color: var(--fio-forte) transparent; }
@supports selector(::-webkit-scrollbar) {
  * { scrollbar-width: auto; scrollbar-color: auto; }
  *:hover { scrollbar-color: auto; }
  ::-webkit-scrollbar { width: 10px; height: 10px; background: transparent; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: transparent; border: 2px solid transparent; border-radius: 5px; background-clip: padding-box; }
  :hover::-webkit-scrollbar-thumb { background-color: var(--fio-forte); }
  ::-webkit-scrollbar-corner { background: transparent; }
}

/* ---------- Casca ---------- */
.app { display: grid; grid-template-columns: var(--sbw) minmax(0, 1fr); height: 100%; position: relative; }
.work { grid-column: 2; display: flex; flex-direction: column; min-width: 0; min-height: 0; background: var(--fundo); position: relative; }
.screen { position: relative; flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; }

/* ---------- Cabeçalho da página e títulos ---------- */
.topbar { flex: none; height: 44px; display: flex; align-items: center; justify-content: flex-end; gap: 6px; padding: 0 12px 0 32px; }
.topbar .grow { flex: 1; }
.save { display: inline-flex; align-items: center; gap: 6px; font: var(--w-ui) 12px/16px var(--f-ui); letter-spacing: 0; color: var(--texto-3); white-space: nowrap; padding: 0 4px; height: 28px; font-variant-numeric: tabular-nums; animation: fadeIn 120ms linear; }
#save-slot, #d-save { display: inline-flex; align-items: center; gap: 6px; }
.save.failed { color: var(--atraso); font-weight: 500; }
.save.conflict { color: var(--conflito); font-weight: 500; }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
.banners { flex: none; display: flex; flex-direction: column; gap: 8px; padding: 0 32px 8px; }
.banners:empty { display: none; }
.banners.col { width: 100%; max-width: 744px; margin: 0 auto; }
.banner { display: flex; align-items: center; gap: 10px; min-height: 36px; padding: 6px 6px 6px 12px; border-radius: 8px; font: var(--w-ui) 13px/20px var(--f-ui); color: var(--texto); }
.banner .bt { flex: 1; min-width: 0; }
.banner.fail { background: var(--atraso-bg); }
.banner.fail > .ic { color: var(--atraso); }
.banner.conf { background: var(--conflito-bg); }
.banner.conf > .ic { color: var(--conflito); }
.banner.draft { background: var(--aviso-bg); }
.banner.draft > .ic { color: var(--aviso); }
.banner.arch { background: var(--hover); }
.banner.arch > .ic { color: var(--icone); }
.ptitle { font: 600 30px/36px var(--f-ui); letter-spacing: -.021em; font-optical-sizing: auto; text-wrap: balance; color: var(--texto); }
.psum { font: var(--w-ui) 13px/20px var(--f-ui); color: var(--texto-2); margin-top: 8px; }
.hair { height: 1px; background: var(--fio); border: 0; margin: 20px 0 0; }

/* ---------- Botões ---------- */
.btn { height: 28px; padding: 0 10px; border: 1px solid var(--fio); border-radius: 6px; display: inline-flex; align-items: center; justify-content: center; gap: 6px; font: 500 13px/20px var(--f-ui); letter-spacing: -.003em; color: var(--texto); background: var(--nivel-1); box-shadow: var(--sombra-card); white-space: nowrap; transition: background-color 100ms ease-out, border-color 100ms ease-out, color 100ms ease-out; }
.btn .ic { color: var(--icone); }
.btn:hover { background: var(--hover-nivel); border-color: var(--fio-forte); }
.btn:hover .ic { color: var(--texto); }
.btn:active { background: var(--ativo); }
.btn.primary { padding: 0 12px; background: var(--acento-solido); border-color: transparent; color: var(--sobre-acento); box-shadow: var(--luz); }
.btn.primary .ic { color: var(--sobre-acento); }
.btn.primary:hover { background: var(--acento-solido-hover); }
.btn.primary:active { transform: translateY(.5px); }
.btn.danger { background: var(--perigo); border-color: transparent; color: var(--sobre-acento); box-shadow: var(--luz); }
.btn.danger:hover { background: var(--perigo); filter: brightness(.92); }
.btn.ghost { border-color: transparent; background: transparent; box-shadow: none; color: var(--texto-2); }
.btn.ghost:hover { background: var(--hover); color: var(--texto); }
.btn.ghost:active { background: var(--ativo); }
.btn.ghost.danger-t, .btn.ghost.danger-t .ic { color: var(--atraso); }
.btn.icon { width: 28px; padding: 0; }
.btn.icon .ic { color: var(--icone); }
.btn.icon:hover .ic { color: var(--texto); }
.btn.sm, .btn.xs { height: 24px; padding: 0 8px; font-size: 12px; line-height: 16px; letter-spacing: 0; }
.btn.sm.icon, .btn.xs.icon { width: 24px; padding: 0; }
.btn[aria-expanded="true"] { background: var(--ativo); }
.btn[disabled], .btn[aria-disabled="true"] { opacity: .45; pointer-events: none; }
.btn .ok-ic { color: var(--ok); }
.copied { color: var(--ok) !important; }
.linkbtn { color: var(--acento); font: 500 13px/20px var(--f-ui); letter-spacing: -.003em; border-radius: 4px; display: inline-flex; gap: 4px; align-items: center; }
.linkbtn:hover { text-decoration: underline; text-underline-offset: 3px; }

/* ---------- Peças: meta, etiquetas, anéis ---------- */
.meta { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; font: var(--w-ui) 12px/16px var(--f-ui); letter-spacing: 0; color: var(--texto-3); }
.lb { display: inline-flex; align-items: center; gap: 5px; height: 20px; padding: 0 6px 0 5px; border: 1px solid var(--fio); border-radius: 4px; font: var(--w-ui) 12px/16px var(--f-ui); letter-spacing: 0; color: var(--texto-2); white-space: nowrap; background: transparent; }
.lb i { width: 7px; height: 7px; border-radius: 2px; background: var(--lc); flex: none; }
.lbs { display: inline-flex; gap: 4px; flex-wrap: wrap; }
.lb-more { display: inline-grid; place-items: center; height: 20px; padding: 0 4px; color: var(--texto-3); }
.prog { display: inline-flex; align-items: center; gap: 4px; color: var(--texto-3); white-space: nowrap; font-variant-numeric: tabular-nums; }
.pring .trk { stroke: var(--fio-forte); }
.pring .val { stroke: var(--acento); }
.prog.full { color: var(--ok); }
.prog.full .pring .val { stroke: var(--ok); }
.due-late { color: var(--atraso); font-weight: 500; display: inline-flex; align-items: center; gap: 4px; white-space: nowrap; }
.cring.c0 { color: var(--icone); }
.cring.cmid { color: var(--acento); }
.cring.done { color: var(--ok); }
.empty { color: var(--texto-3); font: var(--w-ui) 13px/20px var(--f-ui); padding: 8px 0; }

/* ---------- Páginas em coluna (Visão geral, Concluídas, Lixeira, Perfil, índice) ---------- */
.page-root { flex: 1; min-height: 0; overflow: auto; padding: 0 32px; }
.pg { width: 100%; max-width: 720px; margin: 0 auto; padding: 28px 0 120px; }
.sec3 { padding: 20px 0 20px; border-top: 1px solid var(--fio); }
.hair + .sec3, .hair + .banner + .sec3, .sec3.first { border-top: 0; }
.sec3 > .sc { display: flex; align-items: baseline; gap: 6px; margin-bottom: 6px; }
.sec3 > .sc .sub, .sc .sub { font-weight: var(--w-ui); color: var(--texto-3); }
.orow { position: relative; display: grid; grid-template-columns: 14px minmax(0, 1fr) auto 44px; gap: 0 12px; width: calc(100% + 16px); margin: 0 -8px; padding: 0 8px; min-height: 36px; align-items: center; text-align: left; border-radius: 6px; transition: background-color 100ms ease-out; }
.orow:hover { background: var(--hover); }
.orow .st { display: grid; place-items: center; }
.orow .mid { min-width: 0; display: flex; align-items: baseline; gap: 10px; }
.orow .tt { flex: 0 1 auto; min-width: 0; max-width: 70%; font: 500 13px/20px var(--f-ui); letter-spacing: -.003em; color: var(--texto); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.orow .sub { flex: 1 1 0; min-width: 0; font: var(--w-ui) 12px/16px var(--f-ui); letter-spacing: 0; color: var(--texto-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.orow .r { text-align: right; font: var(--w-ui) 12px/16px var(--f-ui); color: var(--texto-3); white-space: nowrap; display: flex; justify-content: flex-end; }
.orow.open { background: var(--selecao); }
.orow.wide { grid-template-columns: minmax(0, 1fr) auto; }
.ofoot { display: flex; justify-content: space-between; align-items: center; gap: 16px; font: var(--w-ui) 12px/16px var(--f-ui); color: var(--texto-3); padding-top: 8px; }
.drow { display: grid; grid-template-columns: 14px minmax(0, 1fr) 56px auto; gap: 12px; align-items: center; min-height: 36px; border-bottom: 1px solid var(--fio); }
.drow.open { background: var(--selecao); }
.drow .tbtn { font: 500 13px/20px var(--f-ui); color: var(--texto); text-align: left; border-radius: 4px; }
.drow .tbtn:hover { color: var(--acento); }
.drow .r { text-align: right; font: var(--w-ui) 12px/16px var(--f-ui); color: var(--texto-3); }
.trow .tt { font-weight: 500; }
.trow .kd { margin-left: 8px; font: var(--w-ui) 12px/16px var(--f-ui); color: var(--texto-3); }
.trow { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 180px) auto auto; gap: 8px; align-items: center; min-height: 36px; border-bottom: 1px solid var(--fio); }
.trow .tcell { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.trow .org { font: var(--w-ui) 12px/16px var(--f-ui); color: var(--texto-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.itable { width: 100%; border-collapse: collapse; font-size: 13px; }
.itable th { text-align: left; height: 32px; padding: 0 8px 0 0; border-bottom: 1px solid var(--fio); white-space: nowrap; font: 500 12px/16px var(--f-ui); color: var(--texto-3); }
.itable th button { color: var(--texto-3); display: inline-flex; gap: 4px; align-items: center; border-radius: 4px; font: inherit; }
.itable th button:hover, .itable th[aria-sort] button { color: var(--texto); }
.itable th.n { text-align: right; }
.itable th.n button { justify-content: flex-end; }
.itable td { height: 36px; padding: 0 8px 0 0; border-bottom: 1px solid var(--fio); vertical-align: middle; }
.itable tbody tr { transition: background-color 100ms ease-out; }
.itable tbody tr:hover { background: var(--hover); }
.itable td.n { font-variant-numeric: tabular-nums; color: var(--texto-3); white-space: nowrap; text-align: right; font-size: 12px; }
.itable td.sn { color: var(--texto-3); max-width: 300px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 12px; }
.itable .tbtn { font: 500 13px/20px var(--f-ui); color: var(--texto); text-align: left; display: inline-flex; align-items: center; gap: 8px; }
.itable .tbtn .ico { color: var(--icone); }
.itable td.kd { font: var(--w-ui) 12px/16px var(--f-ui); color: var(--texto-3); white-space: nowrap; }
.itable tr.grp th { height: 36px; padding: 12px 0 4px; text-align: left; border-bottom: 1px solid var(--fio); font: 500 12px/16px var(--f-ui); color: var(--texto-2); }
.itable tr.grp th > * { vertical-align: middle; }
.itable tr.grp th .ic { display: inline-block; margin-right: 6px; color: var(--icone); }
.itable tr.grp th .n { margin-left: 8px; color: var(--texto-3); font-weight: var(--w-ui); font-variant-numeric: tabular-nums; }
.itable tbody tr.grp:hover { background: transparent; }
.idx-f { margin-top: 12px; }
.chkbtn { display: inline-flex; align-items: center; gap: 8px; height: 28px; padding: 0 6px; border-radius: 6px; font: var(--w-ui) 12px/16px var(--f-ui); color: var(--texto-2); transition: background-color 100ms ease-out, color 100ms ease-out; }
.chkbtn:hover { background: var(--hover); color: var(--texto); }
.chkbtn .sw-ic { position: relative; width: 24px; height: 14px; border-radius: 7px; background: var(--fio-forte); transition: background-color 120ms ease-out; }
.chkbtn .sw-ic::after { content: ""; position: absolute; left: 2px; top: 2px; width: 10px; height: 10px; border-radius: 50%; background: var(--nivel-1); box-shadow: 0 1px 1px rgb(0 0 0 / .15); transition: transform 120ms var(--ease); }
.chkbtn[aria-checked="true"] .sw-ic { background: var(--acento-solido); }
.chkbtn[aria-checked="true"] .sw-ic::after { transform: translateX(10px); background: var(--sobre-acento); }
.itable .tbtn:hover { color: var(--acento); }

/* ---------- Quadro ---------- */
.bhead { flex: none; padding: 8px 32px 0; }
.frow { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin-top: 12px; }
.frow .grow { flex: 1; }
.bcount { color: var(--texto-3); font: var(--w-ui) 12px/16px var(--f-ui); }
.board { flex: 1; min-height: 0; display: flex; gap: 12px; padding: 16px 32px 12px; overflow-x: auto; overflow-y: hidden; }
.kcol { flex: 0 0 clamp(208px, calc((100% - (var(--ncol, 4) - 1) * 12px) / var(--ncol, 4)), 280px); display: flex; flex-direction: column; min-height: 0; border-radius: 10px; transition: background-color 100ms ease-out; }
.kcol.drop { background: var(--hover); }
.kcol-h { flex: none; height: 28px; display: flex; align-items: center; gap: 8px; padding: 0 2px 0 2px; margin-bottom: 6px; }
.kcol-h .grow { flex: 1; }
.kcol-name { font: 500 13px/20px var(--f-ui); letter-spacing: -.003em; color: var(--texto); padding: 0 2px; margin-left: -2px; border-radius: 4px; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.kcol-h .cnt { font: var(--w-ui) 12px/16px var(--f-ui); color: var(--texto-3); }
.kcol-h .col-more { opacity: 0; transition: opacity 100ms ease-out; }
.kcol:hover .col-more, .kcol-h:focus-within .col-more, .col-more[aria-expanded="true"] { opacity: 1; }
.kcol-rename { width: 100%; height: 28px; background: var(--nivel-1); border: 1px solid var(--acento); box-shadow: 0 0 0 3px var(--acento-25); border-radius: 6px; padding: 0 8px; font: 500 13px/20px var(--f-ui); }
.kcol-body { flex: 1; min-height: 0; overflow-y: auto; padding: 4px 4px 12px; margin: 0 -4px; display: flex; flex-direction: column; gap: 8px; }
.klist { display: flex; flex-direction: column; gap: 8px; }
.add-task { font: var(--w-ui) 12px/16px var(--f-ui); color: var(--texto-3); height: 28px; padding: 0 6px; border-radius: 6px; text-align: left; display: flex; gap: 6px; align-items: center; opacity: 0; transition: opacity 100ms ease-out, background-color 100ms ease-out, color 100ms ease-out; }
.add-task .ic { color: var(--icone); }
.kcol:hover .add-task, .add-task:focus-visible, .kcol.empty-col .add-task { opacity: 1; }
.add-task:hover { color: var(--texto); background: var(--hover); }
.add-col { flex: 0 0 120px; margin-left: 20px; }
.add-col .btn { height: 28px; padding: 0 8px; }
.card { position: relative; display: grid; grid-template-columns: 14px minmax(0, 1fr); column-gap: 8px; row-gap: 6px; background: var(--nivel-1); border: 1px solid var(--fio); border-radius: 8px; padding: 10px 12px; box-shadow: var(--sombra-card); transition: background-color 100ms ease-out, border-color 100ms ease-out, box-shadow 100ms ease-out; }
.card > .cr { grid-column: 1; grid-row: 1; padding-top: 2px; }
.card > .card-open { grid-column: 2; grid-row: 1; }
.card > .meta { grid-column: 2; grid-row: 2; }
.card:hover { background: var(--card-hover); border-color: var(--fio-forte); box-shadow: var(--sombra-card-hover); }
.card.ring-open { background: var(--selecao); border-color: var(--acento-35); }
.card:has(.card-open:focus-visible) { outline: 2px solid var(--acento); outline-offset: 2px; }
.card-open { font: 500 13px/18px var(--f-ui); letter-spacing: -.003em; color: var(--texto); text-align: left; padding-right: 18px; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.card-open::after { content: ""; position: absolute; inset: 0; border-radius: 8px; }
.card-open:focus-visible { outline: none; }
.kcol.done-col .card-open { color: var(--texto-2); }
.card-more { position: absolute; top: 7px; right: 7px; z-index: 1; width: 24px; height: 24px; display: grid; place-items: center; border-radius: 6px; color: var(--icone); opacity: 0; transition: opacity 100ms ease-out, background-color 100ms ease-out; }
.card:hover .card-more, .card:focus-within .card-more, .card-more[aria-expanded="true"] { opacity: 1; }
.card-more:hover { background: var(--ativo); color: var(--texto); }
.card .due-late { position: relative; z-index: 1; cursor: pointer; }
.card.dragging { background: transparent; border: 1px dashed var(--fio-forte); box-shadow: none; }
.card.dragging > * { visibility: hidden; }
.drop-ind { height: 2px; background: var(--acento); border-radius: 1px; margin: -5px 0; }
.kempty { color: var(--texto-3); font: var(--w-ui) 12px/16px var(--f-ui); padding: 6px 2px; }
.done-foot { font: var(--w-ui) 12px/16px var(--f-ui); color: var(--texto-3); text-align: left; margin-top: 2px; padding: 4px 2px; }
.done-foot:hover { color: var(--texto); text-decoration: underline; text-underline-offset: 3px; }

/* ---------- Documento: uma coluna de 680 px ---------- */
.doc-scroll { flex: 1; min-height: 0; overflow: auto; padding: 0 32px; scroll-padding-bottom: 24px; }
.doc { width: 100%; max-width: 680px; margin: 0 auto; padding: 28px 0 160px; }
.doc-title { font: 600 30px/36px var(--f-ui); letter-spacing: -.021em; font-optical-sizing: auto; border-radius: 4px; cursor: text; text-wrap: balance; color: var(--texto); }
.doc-title[contenteditable="true"] { outline: none; }
[data-title]:focus-visible { outline: none; }
[data-title][contenteditable="true"]:focus { box-shadow: 0 2px 0 var(--acento); }
.doc .hair { margin: 20px 0 24px; }
.editor { display: flex; flex-direction: column; }
.blk { position: relative; padding: 2px 0; border-radius: 4px; transition: background-color .6s ease-out; }
.blk.flash { background: var(--hover); transition: none; }
.ed { font: 400 15px/24px var(--f-ui); letter-spacing: -.009em; color: var(--texto); min-height: 24px; outline: none; white-space: pre-wrap; overflow-wrap: anywhere; }
.ed:empty::before { content: none; }
.ed:empty:focus::before, .ed.solo:empty::before { content: attr(data-ph); color: var(--texto-3); pointer-events: none; }
.ed b, .ed strong { font-weight: 600; }
.ed code { font: 400 13px/20px var(--f-mono); letter-spacing: 0; background: var(--hover); border: 1px solid var(--fio); border-radius: 4px; padding: 0 4px; }
.ed a { color: var(--acento); text-underline-offset: 3px; text-decoration-thickness: 1px; }
.b-h1 { padding-top: 28px; } .b-h1 .ed { font: 600 24px/32px var(--f-ui); letter-spacing: -.020em; font-optical-sizing: auto; }
.b-h2 { padding-top: 24px; } .b-h2 .ed { font: 600 19px/26px var(--f-ui); letter-spacing: -.016em; font-optical-sizing: auto; }
.b-h3 { padding-top: 16px; } .b-h3 .ed { font: 600 16px/24px var(--f-ui); letter-spacing: -.011em; }
.b-li > .bc, .b-check > .bc { display: flex; gap: 10px; align-items: flex-start; }
.b-li .bul { flex: none; width: 14px; height: 24px; display: grid; place-items: center; }
.b-li .bul::before { content: ""; width: 5px; height: 5px; border-radius: 50%; background: var(--texto-3); }
.b-li .ed, .b-check .ed { flex: 1; min-width: 0; }
.cbx { appearance: none; -webkit-appearance: none; flex: none; width: 14px; height: 14px; margin: 5px 0 0; border: 1.5px solid var(--borda-campo); border-radius: 4px; background: var(--nivel-1); display: grid; place-items: center; cursor: pointer; transition: border-color 100ms ease-out, background-color 100ms ease-out; }
.cbx:hover { border-color: var(--texto-3); }
.cbx:checked { background: var(--acento-solido); border-color: var(--acento-solido); }
.cbx:checked::after { content: ""; width: 7px; height: 3.5px; border: 1.5px solid var(--sobre-acento); border-top: 0; border-right: 0; transform: translateY(-1px) rotate(-45deg); }
.b-check.done .ed { color: var(--texto-3); text-decoration: line-through; text-decoration-color: var(--fio-forte); }
.b-quote .ed { border-left: 2px solid var(--fio-forte); padding-left: 14px; color: var(--texto-2); }
.b-code .ed { font: 400 13px/20px var(--f-mono); letter-spacing: 0; background: var(--nivel-1); border: 1px solid var(--fio); border-radius: 8px; padding: 12px 14px; }
.has-om > .bc > .ed { display: inline; }
.omark { display: inline-grid; place-items: center; width: 18px; height: 18px; vertical-align: -3px; margin-left: 4px; border-radius: 4px; transition: background-color 100ms ease-out; }
.omark .cring { color: var(--acento) !important; }
.omark .cring.done path { stroke: var(--fundo); }
.omark:hover, .omark:focus-visible { background: var(--selecao); }
.blk:has(.omark:hover) .ed, .blk:has(.omark:focus-visible) .ed { text-decoration: underline dotted var(--acento); text-decoration-thickness: 1px; text-underline-offset: 3px; }
.b-embed { padding: 10px 0; }
.ecard { width: 100%; display: flex; flex-direction: column; gap: 6px; background: var(--nivel-1); border: 1px solid var(--fio); border-radius: 8px; padding: 10px 12px; text-align: left; cursor: pointer; box-shadow: var(--sombra-card); transition: border-color 100ms ease-out, background-color 100ms ease-out; }
.ecard:hover { border-color: var(--fio-forte); }
.ecard .l1 { display: flex; align-items: center; gap: 8px; font: 500 14px/20px var(--f-ui); letter-spacing: -.006em; color: var(--texto); }
.ecard .l1 .tt { flex: 1; min-width: 0; }
.ecard .l1 .open-t { font: var(--w-ui) 12px/16px var(--f-ui); letter-spacing: 0; color: var(--texto-3); white-space: nowrap; }
.ecard .l2 { display: flex; align-items: center; gap: 12px; padding-left: 22px; }
.ecard .l2 .meta { flex: 1; }
.ecard .l2 .colr { font: var(--w-ui) 12px/16px var(--f-ui); color: var(--texto-3); white-space: nowrap; }
.ecard.is-open { background: var(--selecao); border-color: var(--acento-35); }
.edraw { width: 100%; display: flex; flex-direction: column; gap: 8px; text-align: left; }
.edraw .frame { display: block; width: 100%; max-height: 380px; overflow: hidden; background: var(--fundo); border: 1px solid var(--fio); border-radius: 8px; padding: 12px; transition: border-color 100ms ease-out; }
.edraw:hover .frame { border-color: var(--fio-forte); }
.edraw .frame svg { width: 100%; height: auto; max-height: 356px; display: block; }
.edraw .cap { display: flex; justify-content: space-between; gap: 12px; font: var(--w-ui) 12px/16px var(--f-ui); letter-spacing: 0; color: var(--texto-3); }
.edraw .cap .go { color: var(--acento); white-space: nowrap; opacity: 0; transition: opacity 100ms ease-out; }
.edraw:hover .cap .go, .edraw:focus-visible .cap .go { opacity: 1; }
.emiss { display: flex; align-items: center; gap: 10px; border: 1px dashed var(--fio-forte); border-radius: 8px; padding: 6px 6px 6px 12px; min-height: 44px; color: var(--texto-2); font: var(--w-ui) 13px/20px var(--f-ui); }
.emiss > .ic { color: var(--icone); }
.emiss .grow { flex: 1; min-width: 0; }
.emiss .acts { display: flex; gap: 2px; align-items: center; }
::highlight(tf-origem) { text-decoration: underline dotted var(--acento); text-decoration-thickness: 1px; text-underline-offset: 3px; color: var(--texto); }

/* barra de formatação */
.fmt { position: fixed; z-index: 60; display: flex; align-items: center; gap: 2px; background: var(--nivel-2); border: 1px solid var(--fio); border-radius: 10px; box-shadow: var(--sombra), var(--luz); padding: 4px; animation: popIn 140ms var(--ease); }
.fmt button { height: 28px; min-width: 28px; padding: 0 6px; border-radius: 6px; display: inline-flex; align-items: center; justify-content: center; gap: 6px; color: var(--icone); }
.fmt button:hover { background: var(--hover-nivel); color: var(--texto); }
.fmt .vr { width: 1px; height: 16px; background: var(--fio); margin: 0 4px; }
.fmt .tk { color: var(--acento); font: 500 13px/1 var(--f-ui); padding: 0 8px; }
.fmt input { height: 28px; width: 220px; background: var(--nivel-1); border: 1px solid var(--borda-campo); border-radius: 6px; padding: 0 8px; font-size: 13px; }
.fmt input:focus { outline: none; border-color: var(--acento); box-shadow: 0 0 0 3px var(--acento-25); }

/* ---------- Gaveta da tarefa ---------- */
.drawer { container: gaveta / inline-size; flex: none; display: flex; flex-direction: column; background: var(--nivel-2); border-top: 1px solid var(--fio); border-radius: 12px 12px 0 0; box-shadow: var(--sombra-gaveta), var(--luz); min-height: 0; animation: drawerIn 200ms var(--ease); position: relative; z-index: 5; }
@keyframes drawerIn { from { transform: translateY(16px); opacity: 0; } to { transform: none; opacity: 1; } }
.drawer-ghost { position: fixed; z-index: 4; margin: 0; pointer-events: none; animation: none; }
.d-handle { flex: none; height: 12px; display: grid; place-items: center; cursor: ns-resize; touch-action: none; border-radius: 12px 12px 0 0; }
.d-handle span { width: 32px; height: 4px; border-radius: 2px; background: var(--fio-forte); transition: background-color 100ms ease-out; }
.d-handle:hover span, .d-handle:focus-visible span { background: var(--borda-campo); }
.d-handle:focus-visible { outline-offset: -2px; }
.d-head { flex: none; height: 52px; display: flex; align-items: center; gap: 10px; padding: 0 16px 0 32px; }
.d-state { width: 24px; height: 24px; display: grid; place-items: center; border-radius: 6px; margin-left: -4px; flex: none; transition: background-color 100ms ease-out; }
.d-state:hover { background: var(--hover-nivel); }
.d-title { flex: 1; min-width: 0; height: 28px !important; resize: none; overflow: hidden; white-space: pre; background: transparent; border: 0; border-radius: 4px; padding: 0; font: 600 20px/28px var(--f-ui); letter-spacing: -.017em; font-optical-sizing: auto; color: var(--texto); }
.d-title:focus-visible { outline: none; box-shadow: 0 2px 0 var(--acento); }
.d-title::placeholder { color: var(--texto-3); }
.d-head .acts { display: flex; gap: 4px; align-items: center; flex: none; }
.d-head .acts .save + .btn { margin-right: 4px; }
.d-body { flex: 1; min-height: 0; overflow: auto; display: grid; grid-template-columns: minmax(0, 1fr) 1px 300px; column-gap: 24px; padding: 4px 32px 28px; align-items: start; }
.d-desc { max-width: 640px; min-width: 0; display: flex; flex-direction: column; gap: 8px; }
.d-vr { align-self: stretch; background: var(--fio); width: 1px; }
.d-props { min-width: 0; display: flex; flex-direction: column; }
.props { display: grid; grid-template-columns: 88px minmax(0, 1fr); grid-auto-rows: minmax(30px, auto); align-items: center; column-gap: 8px; }
.props dt { font: var(--w-ui) 12px/16px var(--f-ui); letter-spacing: 0; color: var(--texto-3); }
.props dd { display: flex; align-items: center; gap: 4px 6px; flex-wrap: wrap; min-width: 0; font: var(--w-ui) 13px/20px var(--f-ui); font-variant-numeric: tabular-nums; color: var(--texto); }
.pbtn { white-space: nowrap; height: 26px; padding: 0 6px; margin-left: -6px; border-radius: 6px; display: inline-flex; align-items: center; gap: 6px; font: var(--w-ui) 13px/20px var(--f-ui); letter-spacing: -.003em; color: var(--texto); transition: background-color 100ms ease-out; }
.pbtn:hover { background: var(--hover-nivel); }
.pbtn:focus-visible { outline-offset: 0; }
.pbtn .chev { color: var(--icone); opacity: 0; transition: opacity 100ms ease-out; }
.pbtn:hover .chev, .pbtn:focus-visible .chev { opacity: 1; }
.pbtn.late, .pbtn.late .rel { color: var(--atraso); }
.pbtn .rel { color: var(--texto-3); }
.pbtn .mark { width: 16px; height: 16px; border-radius: 4px; font-size: 10px; }
.lb.tag { padding-right: 2px; transition: border-color 100ms ease-out; }
.lb.tag:hover { border-color: var(--fio-forte); }
.lb.tag .x { width: 16px; height: 16px; display: grid; place-items: center; border-radius: 3px; color: var(--icone); opacity: 0; margin-left: -1px; }
.lb.tag:hover .x, .lb.tag .x:focus-visible { opacity: 1; }
.lb.tag .x:hover { color: var(--texto); background: var(--hover-nivel); }
.lb.tag:not(:hover):not(:focus-within) .x { width: 4px; }
.clbar { display: inline-block; width: 64px; height: 4px; border-radius: 2px; background: var(--fio-forte); overflow: hidden; }
.clbar i { display: block; height: 100%; background: var(--acento); border-radius: 2px; }
.clbar.full i { background: var(--ok); }
#insp-prog { gap: 8px; }
.origin { display: grid; grid-template-columns: 88px minmax(0, 1fr); column-gap: 8px; row-gap: 2px; border-top: 1px solid var(--fio); margin-top: 8px; padding-top: 10px; }
.origin:empty { display: none; }
.origin .oh { font: var(--w-ui) 12px/20px var(--f-ui); color: var(--texto-3); }
.origin .olink { font: 500 13px/20px var(--f-ui); color: var(--acento); display: inline-flex; gap: 4px; align-items: center; text-align: left; border-radius: 4px; }
.origin .olink:hover { text-decoration: underline; text-underline-offset: 3px; }
.origin q { grid-column: 2; color: var(--texto-2); font: var(--w-ui) 12px/18px var(--f-ui); letter-spacing: 0; quotes: "“" "”"; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.origin .miss { grid-column: 2; color: var(--texto-2); font-size: 12px; }
.drawer .ed { font-size: 14px; line-height: 22px; letter-spacing: -.006em; min-height: 22px; }
.drawer .b-check .cbx { margin-top: 4px; }
.drawer .b-check { min-height: 28px; display: flex; align-items: center; }
.drawer .b-check > .bc { flex: 1; align-items: center; }
.drawer .b-check .cbx { margin-top: 0; }
.drawer .b-li .bul { height: 22px; }
#insp-banner { display: flex; flex-direction: column; gap: 6px; }
#insp-banner:empty { display: none; }
.newinfo { display: flex; flex-direction: column; gap: 12px; color: var(--texto-2); padding-top: 4px; }
.chk { display: inline-flex; gap: 10px; align-items: center; cursor: pointer; color: var(--texto); }
.chk .cbx { margin: 0; }
.ferr { color: var(--atraso); font: var(--w-ui) 12px/16px var(--f-ui); display: flex; gap: 6px; align-items: center; margin-top: 4px; }
.field { width: 100%; height: 32px; background: var(--nivel-1); border: 1px solid var(--borda-campo); border-radius: 6px; padding: 0 10px; font: var(--w-ui) 13px/20px var(--f-ui); color: var(--texto); transition: border-color 100ms ease-out, box-shadow 100ms ease-out; }
.field:hover { border-color: var(--texto-3); }
.field:focus { outline: none; border-color: var(--acento); box-shadow: 0 0 0 3px var(--acento-25); }
.field[aria-invalid="true"] { border-color: var(--atraso); }
.field::placeholder { color: var(--texto-3); }
.flab { display: block; font: 500 12px/16px var(--f-ui); color: var(--texto-2); margin-bottom: 6px; }

/* ---------- Desenho ---------- */
.dg-top { flex: none; padding: 28px 32px 16px; }
.dg-top .pg-in { max-width: none; }
.dg-title { font: 600 30px/36px var(--f-ui); letter-spacing: -.021em; font-optical-sizing: auto; border-radius: 4px; cursor: text; min-width: 40px; }
.dg-frame { position: relative; flex: 1; min-height: 0; margin: 0 32px 16px; border: 1px solid var(--fio); border-radius: 8px; background: var(--fundo); overflow: hidden; }
#dg-canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; user-select: none; -webkit-user-select: none; cursor: crosshair; }
#dg-canvas [data-sid] { cursor: move; }
#dg-canvas:focus-visible { outline: 2px solid var(--acento); outline-offset: -2px; }
.dg-tools, .dg-zoom, .dg-hist { position: absolute; display: flex; gap: 2px; background: var(--nivel-2); border: 1px solid var(--fio); border-radius: 10px; padding: 4px; z-index: 2; box-shadow: var(--sombra), var(--luz); }
.dg-tools { top: 12px; left: 50%; transform: translateX(-50%); }
.dg-zoom { left: 12px; bottom: 12px; align-items: center; }
.dg-hist { left: 152px; bottom: 12px; }
.dg-tools button, .dg-zoom button, .dg-hist button { width: 28px; height: 28px; border-radius: 6px; display: grid; place-items: center; color: var(--icone); transition: background-color 100ms ease-out, color 100ms ease-out; }
.dg-tools button:hover, .dg-zoom button:hover, .dg-hist button:hover { background: var(--hover-nivel); color: var(--texto); }
.dg-tools button[aria-pressed="true"] { background: var(--selecao); color: var(--acento); }
.dg-zoom .zv { font: var(--w-ui) 12px/16px var(--f-ui); color: var(--texto-2); width: 44px; text-align: center; font-variant-numeric: tabular-nums; }
.dg-label-in { position: absolute; z-index: 3; background: var(--nivel-1); border: 1px solid var(--acento); box-shadow: 0 0 0 3px var(--acento-25); border-radius: 6px; color: var(--texto); font: 400 15px/20px var(--f-ui); padding: 2px 6px; text-align: center; }
.dgs { fill: none; stroke: var(--texto); stroke-width: 1.5; stroke-linejoin: round; stroke-linecap: round; }
.dgs.fillb { fill: var(--fundo); }
.dgs.dash { stroke: var(--texto-3); stroke-dasharray: 6 5; }
.dga { fill: none; stroke: var(--texto-2); stroke-width: 1.5; stroke-linecap: round; }
.dga.dash { stroke-dasharray: 6 5; stroke: var(--texto-3); }
.dgh { fill: var(--texto-2); stroke: none; }
.dgt { fill: var(--texto); font: 450 15px var(--f-ui); letter-spacing: -.009em; }
.dgt.small { fill: var(--texto-3); font: 400 13px var(--f-ui); }
.dg-sel { fill: none; stroke: var(--acento); stroke-width: 1.5; stroke-dasharray: 4 3; }
.dg-grid { fill: var(--fio-forte); }
.hitbox { fill: var(--fundo); fill-opacity: 0; }
.hitline { fill: none; stroke: var(--fundo); stroke-opacity: 0; stroke-width: 14; }

/* ---------- Perfil ---------- */
.psec { padding: 20px 0 22px; border-top: 1px solid var(--fio); display: flex; flex-direction: column; gap: 10px; }
.hair + .psec { border-top: 0; }
.psec .body { display: flex; flex-direction: column; gap: 12px; }
.psec .acts { display: flex; justify-content: space-between; align-items: center; gap: 16px; }
.psec p.lead { color: var(--texto-2); }
.ptable { width: 100%; border-collapse: collapse; }
.ptable th { text-align: left; height: 32px; padding: 0 8px 0 0; border-bottom: 1px solid var(--fio); font: 500 12px/16px var(--f-ui); color: var(--texto-3); }
.ptable td { height: 40px; padding: 0 8px 0 0; border-bottom: 1px solid var(--fio); font-size: 13px; }
.ptable td.m { color: var(--texto-3); font: var(--w-ui) 12px/16px var(--f-ui); font-variant-numeric: tabular-nums; }
.ptable td.act { text-align: right; width: 1%; white-space: nowrap; }
.ptable tr.new td.m { color: var(--ok); }
.ptable tr.new td:first-child { font-weight: 500; }
.ptable .emptyrow td { color: var(--texto-3); }
.well { background: var(--nivel-1); border: 1px solid var(--fio); border-radius: 8px; padding: 12px 14px; font: 400 13px/20px var(--f-mono); letter-spacing: 0; color: var(--texto); white-space: pre-wrap; overflow-wrap: anywhere; }
.well .am { color: var(--acento); }
.sess li { display: flex; align-items: center; gap: 12px; min-height: 40px; border-bottom: 1px solid var(--fio); }
.sess li .grow { flex: 1; }
.sess .ic { color: var(--icone); }
.pill { font: 500 12px/16px var(--f-ui); color: var(--ok); }
.pwform { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; align-items: start; padding: 4px 0; }
.pwform .form-act { grid-column: 1 / -1; display: flex; gap: 8px; }
.seg { align-self: flex-start; display: inline-flex; border: 1px solid var(--fio); background: var(--nivel-1); border-radius: 8px; padding: 2px; gap: 2px; }
.seg label { display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 10px; border-radius: 6px; cursor: pointer; color: var(--texto-2); font: 500 12px/16px var(--f-ui); transition: background-color 100ms ease-out, color 100ms ease-out; }
.seg label .ic { color: var(--icone); }
.seg input { position: absolute; opacity: 0; pointer-events: none; }
.seg label:hover { color: var(--texto); }
.seg label:has(input:checked) { background: var(--ativo); color: var(--texto); }
.seg label:has(input:checked) .ic { color: var(--texto); }
.seg label:has(input:focus-visible) { outline: 2px solid var(--acento); outline-offset: 1px; }

/* ---------- Menus, popovers ---------- */
.menu { position: fixed; z-index: 100; min-width: 220px; max-width: 360px; max-height: min(480px, calc(100vh - 48px)); overflow: auto; background: var(--nivel-2); border: 1px solid var(--fio); border-radius: 10px; box-shadow: var(--sombra), var(--luz); padding: 4px; animation: popIn 140ms var(--ease); }
@keyframes popIn { from { opacity: 0; transform: scale(.98); } to { opacity: 1; transform: none; } }
.mi { width: 100%; min-height: 30px; display: flex; align-items: center; gap: 8px; padding: 4px 8px; border-radius: 6px; font: var(--w-ui) 13px/20px var(--f-ui); color: var(--texto); text-align: left; }
.mi > .ic { color: var(--icone); }
.mi .ml { flex: 1; min-width: 0; }
.mi .mk { color: var(--texto-3); font: var(--w-ui) 12px/16px var(--f-ui); }
.mi kbd.mk { font: 500 11px/14px var(--f-ui); }
.mi .note { display: block; font: var(--w-ui) 12px/16px var(--f-ui); color: var(--texto-3); }
.mi:hover, .mi:focus { background: var(--hover-nivel); }
.mi:hover > .ic, .mi:focus > .ic { color: var(--texto); }
.mi:focus-visible { outline: none; }
.mi.danger, .mi.danger > .ic { color: var(--atraso); }
.mi[aria-disabled="true"] { opacity: .45; }
.mi .radio { width: 16px; height: 16px; flex: none; display: grid; place-items: center; color: var(--acento); }
.mi[aria-checked="true"] .radio::after { content: ""; width: 9px; height: 4.5px; border: 1.5px solid currentColor; border-top: 0; border-right: 0; transform: translateY(-1.5px) rotate(-45deg); }
.mi-h { padding: 8px 8px 4px; font: 500 11px/14px var(--f-ui); color: var(--texto-3); }
.mi-sep { height: 1px; background: var(--fio); margin: 4px; }
.pop { position: fixed; z-index: 90; background: var(--nivel-2); border: 1px solid var(--fio); border-radius: 10px; box-shadow: var(--sombra), var(--luz); animation: popIn 140ms var(--ease); }
.tip { position: fixed; z-index: 120; background: var(--toast); color: var(--sobre-toast); border-radius: 6px; padding: 4px 8px; font: 450 12px/16px var(--f-ui); letter-spacing: 0; pointer-events: none; white-space: nowrap; box-shadow: var(--sombra); }
.tip .c { color: inherit; font-weight: 600; }
.ghint { position: fixed; right: 16px; bottom: var(--toast-b); z-index: 120; background: var(--toast); color: var(--sobre-toast); border-radius: 8px; padding: 6px 12px; font: 450 13px/20px var(--f-ui); pointer-events: none; box-shadow: var(--sombra); }
.ghint b { font-weight: 600; }
.dp { padding: 10px; width: 272px; }
.dp-h { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; }
.dp-h .m { font-weight: 600; font-size: 13px; }
.dp table { border-collapse: collapse; width: 100%; }
.dp th { padding: 4px 0; text-align: center; font: 500 11px/14px var(--f-ui); color: var(--texto-3); }
.dp td { padding: 1px; text-align: center; }
.dp .day { width: 34px; height: 30px; border-radius: 6px; font: var(--w-ui) 12px/1 var(--f-ui); color: var(--texto); font-variant-numeric: tabular-nums; transition: background-color 100ms ease-out; }
.dp .day:hover { background: var(--hover-nivel); }
.dp .day.out { color: var(--texto-3); }
.dp .day.today { box-shadow: inset 0 0 0 1px var(--fio-forte); }
.dp .day[aria-pressed="true"] { background: var(--acento-solido); color: var(--sobre-acento); }
.dp-f { display: flex; justify-content: space-between; gap: 8px; margin-top: 8px; border-top: 1px solid var(--fio); padding-top: 8px; }
.cbox { width: 260px; padding: 4px; }
.cbox input { width: 100%; height: 36px; background: transparent; border: 0; border-bottom: 1px solid var(--fio); border-radius: 0; padding: 0 8px; font: var(--w-ui) 13px/20px var(--f-ui); }
.cbox input::placeholder { color: var(--texto-3); }
.cbox input:focus-visible { outline: none; }
.cbox ul, .slash ul { margin-top: 4px; max-height: 300px; overflow: auto; }
.opt { min-height: 30px; display: flex; align-items: center; gap: 8px; padding: 4px 8px; border-radius: 6px; cursor: pointer; font: var(--w-ui) 13px/20px var(--f-ui); color: var(--texto); }
.opt[aria-selected="true"], .opt:hover { background: var(--hover-nivel); }
.opt .ok { margin-left: auto; color: var(--texto-3); font: var(--w-ui) 12px/16px var(--f-ui); font-variant-numeric: tabular-nums; display: inline-flex; gap: 8px; align-items: center; }
.opt .ok .late-t { color: var(--atraso); }
.opt.cur { font-weight: 500; }
.opt .okc { color: var(--acento); }
.opt .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.opt-h { padding: 8px 8px 4px; font: 500 11px/14px var(--f-ui); letter-spacing: .005em; color: var(--texto-3); }
.opt-sep { height: 1px; background: var(--fio); margin: 4px; }
.slash { width: 260px; padding: 4px; }
.slash .opt .ic { color: var(--icone); }
.slash .opt .d { margin-left: auto; font: 400 11px/14px var(--f-mono); color: var(--texto-3); }
.swpop { width: 300px; padding: 4px; }
.swpop .cbox { margin: -4px -4px 0; }
.swpop .cbox input { height: 40px; padding: 0 12px; }
.cols { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.sw { display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 8px; border-radius: 6px; border: 1px solid var(--fio); font-size: 13px; background: var(--nivel-1); }
.sw[aria-pressed="true"] { border-color: var(--acento); box-shadow: 0 0 0 3px var(--acento-25); }

/* ---------- Diálogos ---------- */
.dlg { background: var(--nivel-3); color: var(--texto); border: 1px solid var(--fio); border-radius: 12px; box-shadow: var(--sombra), var(--luz); padding: 0; width: min(520px, calc(100vw - 32px)); max-height: calc(100vh - 64px); }
.dlg::backdrop { background: var(--veu); animation: fadeIn 120ms ease-out; }
.dlg[open] { animation: popIn 160ms var(--ease); }
.dlg-in { padding: 20px 20px 16px; display: flex; flex-direction: column; gap: 14px; }
.dlg h2 { font: 600 16px/24px var(--f-ui); letter-spacing: -.011em; color: var(--texto); }
.dlg p { color: var(--texto-2); }
.dlg-act { display: flex; justify-content: flex-end; gap: 8px; padding-top: 4px; flex-wrap: wrap; }
.dlg-act .left { margin-right: auto; }
.radios { display: flex; flex-direction: column; gap: 2px; }
.radios label { display: flex; align-items: center; gap: 10px; min-height: 32px; padding: 0 8px; border-radius: 6px; cursor: pointer; }
.radios label:hover { background: var(--hover-nivel); }
.radios input { appearance: none; -webkit-appearance: none; width: 14px; height: 14px; border-radius: 50%; border: 1.5px solid var(--borda-campo); margin: 0; display: grid; place-items: center; }
.radios input:checked { border-color: var(--acento-solido); }
.radios input:checked::after { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--acento-solido); }
.radios .d { margin-left: auto; font-size: 12px; color: var(--texto-3); }
.warn { background: var(--aviso-bg); color: var(--texto); border-radius: 8px; padding: 8px 12px; display: flex; gap: 10px; align-items: center; }
.warn .ic { color: var(--aviso); }
.tokval { background: var(--nivel-1); border: 1px solid var(--fio); border-radius: 8px; padding: 10px 12px; font: 400 13px/20px var(--f-mono); letter-spacing: 0; color: var(--texto); user-select: all; overflow-wrap: anywhere; }
.keys { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 2px 28px; }
.keys h3 { grid-column: 1 / -1; margin-top: 10px; padding-bottom: 6px; border-bottom: 1px solid var(--fio); font: 500 12px/16px var(--f-ui); color: var(--texto-3); }
.keys .k { display: flex; justify-content: space-between; gap: 12px; min-height: 28px; align-items: center; font-size: 13px; color: var(--texto-2); }
.keys .k span:last-child { display: inline-flex; gap: 4px; flex-wrap: wrap; justify-content: flex-end; }
.cmpgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.cmpgrid > div { background: var(--nivel-1); border: 1px solid var(--fio); border-radius: 8px; padding: 10px 12px; font-size: 13px; color: var(--texto-2); }
.cmpgrid .h { display: block; margin-bottom: 6px; font-size: 12px; color: var(--texto-3); }
.cmpgrid ins { text-decoration: none; background: var(--aviso-bg); color: var(--texto); }
.mdprev { max-height: 340px; overflow: auto; }

/* ---------- ⌘K ---------- */
.cmd { position: fixed; inset: 0; width: 100%; height: 100%; max-width: none; max-height: none; margin: 0; padding: 0; border: 0; background: transparent; color: var(--texto); overflow: hidden; }
.cmd::backdrop { background: var(--veu); animation: fadeIn 120ms ease-out; }
.cmd-panel { position: absolute; left: 50%; top: 12vh; transform: translateX(-50%); width: min(640px, calc(100vw - 32px)); max-height: min(520px, calc(100vh - 120px)); background: var(--nivel-2); border: 1px solid var(--fio); border-radius: 12px; box-shadow: var(--sombra), var(--luz); display: flex; flex-direction: column; overflow: hidden; animation: cmdIn 160ms var(--ease); }
@keyframes cmdIn { from { opacity: 0; transform: translate(-50%, -6px); } to { opacity: 1; transform: translateX(-50%); } }
.cmd-top { display: flex; align-items: center; gap: 10px; padding: 0 16px; height: 48px; border-bottom: 1px solid var(--fio); flex: none; }
.cmd-top .ic { color: var(--icone); }
.cmd-top input { flex: 1; min-width: 0; background: transparent; border: 0; height: 46px; font: var(--w-ui) 15px/22px var(--f-ui); letter-spacing: -.009em; color: var(--texto); }
.cmd-top input:focus-visible { outline: none; }
.cmd-top input::placeholder { color: var(--texto-3); }
.cmd-list { overflow: auto; padding: 4px 0 8px; }
.cmd-g { padding: 10px 18px 4px; font: 500 11px/14px var(--f-ui); letter-spacing: .005em; color: var(--texto-3); }
.cmd-opt { display: flex; flex-direction: column; justify-content: center; gap: 2px; min-height: 36px; margin: 0 6px; padding: 6px 12px; border-radius: 6px; cursor: pointer; }
.cmd-opt .l1 { display: flex; gap: 10px; align-items: center; color: var(--icone); }
.cmd-opt .l1 .lab { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--texto); font: var(--w-ui) 13px/20px var(--f-ui); }
.cmd-opt .l1 .r { font: var(--w-ui) 12px/16px var(--f-ui); color: var(--texto-3); white-space: nowrap; display: inline-flex; gap: 6px; align-items: center; }
.cmd-opt .snip { padding-left: 26px; font: var(--w-ui) 12px/16px var(--f-ui); color: var(--texto-3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cmd-opt mark { background: none; color: var(--texto); font-weight: 600; }
.cmd-opt[aria-selected="true"] { background: var(--hover-nivel); }
.cmd-opt[aria-selected="true"] .l1 > .ic { color: var(--texto); }
.cmd-opt .arch { color: var(--texto-3); border: 1px solid var(--fio); border-radius: 4px; padding: 0 5px; font-size: 11px; line-height: 16px; }
.cmd-foot { flex: none; display: flex; gap: 16px; align-items: center; height: 32px; padding: 0 16px; border-top: 1px solid var(--fio); font: var(--w-ui) 12px/16px var(--f-ui); color: var(--texto-3); }
.cmd-foot span { display: inline-flex; gap: 4px; align-items: center; }

/* ---------- Toasts (canto inferior direito da área de conteúdo) ---------- */
.toasts { position: fixed; right: 16px; bottom: var(--toast-b); z-index: 110; display: flex; flex-direction: column; gap: 8px; align-items: flex-end; pointer-events: none; }
.toast { pointer-events: auto; background: var(--toast); color: var(--sobre-toast); border-radius: 8px; box-shadow: var(--sombra), var(--luz); padding: 8px 8px 8px 12px; display: flex; align-items: center; gap: 12px; max-width: 360px; font: 450 13px/20px var(--f-ui); letter-spacing: -.003em; animation: toastIn 180ms var(--ease); }
.toast.out { animation: toastOut 140ms var(--ease) forwards; }
@keyframes toastIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
@keyframes toastOut { to { opacity: 0; transform: translateY(8px); } }
.toast .tt { flex: 1; min-width: 0; }
.toast .tb { flex: none; height: 24px; padding: 0 8px; border: 1px solid rgb(255 255 255 / .18); border-radius: 6px; color: var(--sobre-toast); font: 500 12px/16px var(--f-ui); transition: background-color 100ms ease-out; }
.toast .tb:hover { background: rgb(255 255 255 / .08); }

/* ---------- Painel do protótipo (fora do produto) ---------- */
.proto-panel { position: fixed; left: calc(var(--sbw) + 12px); bottom: 12px; z-index: 95; width: 340px; max-height: calc(100vh - 32px); overflow: auto; background: var(--nivel-2); border: 1px dashed var(--borda-campo); border-radius: 10px; box-shadow: var(--sombra), var(--luz); padding: 12px; display: flex; flex-direction: column; gap: 12px; animation: popIn 140ms var(--ease); }
.proto-panel h2 { font: 600 13px/18px var(--f-ui); color: var(--texto-2); display: flex; justify-content: space-between; align-items: center; }
.proto-panel h3 { margin-bottom: 6px; font: 500 11px/14px var(--f-ui); color: var(--texto-3); }
.proto-panel p { font-size: 12px; line-height: 18px; color: var(--texto-3); }
.pp-grid { display: flex; flex-wrap: wrap; gap: 4px; }
.pp-seg { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px; }
.pp-seg button { display: flex; flex-direction: column; gap: 2px; padding: 6px 8px; border: 1px solid var(--fio); border-radius: 8px; background: var(--nivel-1); font: 600 13px/16px var(--f-ui); color: var(--texto); text-align: left; transition: border-color 100ms ease-out, background-color 100ms ease-out; }
.pp-seg button span { font: var(--w-ui) 11px/14px var(--f-ui); color: var(--texto-3); }
.pp-seg button:hover { border-color: var(--fio-forte); background: var(--hover-nivel); }
.pp-seg button[aria-checked="true"] { border-color: var(--acento); box-shadow: 0 0 0 3px var(--acento-25); background: var(--selecao); }
.pp-grid button { font: var(--w-ui) 12px/16px var(--f-ui); color: var(--texto-2); border: 1px solid var(--fio); border-radius: 6px; padding: 3px 8px; background: var(--nivel-1); }
.pp-grid button:hover { background: var(--hover-nivel); color: var(--texto); border-color: var(--fio-forte); }
.proto-panel details { font-size: 12px; color: var(--texto-2); }
.proto-panel summary { cursor: pointer; font-weight: 500; color: var(--texto-3); }
.proto-panel ol { list-style: decimal; padding-left: 18px; margin-top: 6px; display: flex; flex-direction: column; gap: 3px; line-height: 17px; }

/* ---------- Gaveta estreita: conteúdo abaixo de ~936 px (uma janela de 1200 px com a barra aberta) ---------- */
@container gaveta (max-width: 935px) {
  .d-body { grid-template-columns: minmax(0, 1fr); row-gap: 14px; }
  .d-vr { display: none; }
  .d-props { order: -1; border-bottom: 1px solid var(--fio); padding-bottom: 8px; }
  .props { grid-template-columns: 88px minmax(0, 1fr) 88px minmax(0, 1fr); }
  .origin { grid-template-columns: 88px minmax(0, 1fr); }
  .d-desc { max-width: none; }
}
@media (max-width: 760px) {
  .page-root, .doc-scroll { padding: 0 16px; }
  .board { padding: 16px; }
  .bhead { padding: 16px 16px 0; }
  .pwform { grid-template-columns: minmax(0, 1fr); }
}
/* movimento reduzido: sem translação nem escala, só fades curtos */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition-duration: 1ms !important; animation-duration: 80ms !important; }
  @keyframes popIn { from { opacity: 0; } to { opacity: 1; } }
  @keyframes drawerIn { from { opacity: 0; } to { opacity: 1; } }
  @keyframes toastIn { from { opacity: 0; } to { opacity: 1; } }
  @keyframes toastOut { to { opacity: 0; } }
  @keyframes rowIn { from { opacity: 0; } to { opacity: 1; } }
  @keyframes cmdIn { from { opacity: 0; transform: translateX(-50%); } to { opacity: 1; transform: translateX(-50%); } }
}

/* ---------- Barra lateral (variante A com pastas): 256 px · chevron x 12–24 · ícone x 28–44 · texto x=52 (filhos x=76) · contagens x=240 ---------- */
.sidebar { --sb-bg: var(--barra-a-fundo); --sb-hover: var(--barra-a-hover); --sb-ativo: var(--barra-a-ativo); position: relative; grid-column: 1; grid-row: 1; background: var(--sb-bg); display: flex; flex-direction: column; min-height: 0; min-width: 0; z-index: 40; }
.sidebar::after { content: ""; position: absolute; top: 0; right: 0; bottom: 0; width: 1px; background: var(--fio); pointer-events: none; z-index: 3; }
.sb-top, .sb-navbox, .sb-filter, .sb-foot { flex: none; }
.sb-body { flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; padding: 16px 8px 16px; }
.sb-top { display: flex; align-items: center; gap: 4px; height: 44px; padding: 0 8px; }
.switcher { min-width: 0; height: 32px; display: flex; align-items: center; gap: 6px; padding: 0 8px 0 18px; border-radius: 6px; font: 600 13px/20px var(--f-ui); letter-spacing: -.003em; color: var(--texto); text-align: left; transition: background-color 100ms ease-out; }
.switcher .nm { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.switcher .chev { color: var(--icone); flex: none; margin-left: -2px; }
.switcher:hover, .switcher[aria-expanded="true"] { background: var(--sb-hover); }
.switcher:focus-visible { outline: none; box-shadow: inset 0 0 0 2px var(--acento); }
.mark { width: 20px; height: 20px; border-radius: 6px; display: inline-grid; place-items: center; font: 600 11px/1 var(--f-ui); letter-spacing: 0; font-feature-settings: "cv05", "ss03", "case"; background: var(--mb); color: var(--mf); flex: none; }
.sb-icon { position: relative; width: 28px; height: 28px; display: grid; place-items: center; border-radius: 6px; color: var(--icone); flex: none; transition: color 100ms ease-out, background-color 100ms ease-out, opacity 100ms ease-out; }
.sb-icon:hover { background: var(--sb-hover); color: var(--texto); }
.sb-icon:focus-visible { outline: none; box-shadow: inset 0 0 0 2px var(--acento); }
.sb-top .sb-tog { margin-left: auto; opacity: 0; }
.sb-top:hover .sb-tog, .sb-top .sb-tog:focus-visible { opacity: 1; }
/* Buscar: uma linha da navegação que vira campo no lugar */

const SV = {};

}
function finishSave(id) {

}
function simTarget() {
  const r = S.ui.route;

  const s = sv(id);

  if (kind === 'fail') { s.failing = true; s.state = 'saving'; s.timer = setTimeout(() => finishSave(id), 700); }
  if (kind === 'conflict') { s.failing = false; s.state = 'conflict'; s.conflictAt = fmtMin(clockMin() - 2); say('Conflito: mudou em outro dispositivo.'); }

function keyOf(el) {
  if (!el || el === document.body) return null;
  if (el.dataset && el.dataset.fk) return 'fk:' + el.dataset.fk;
  if (el.dataset && el.dataset.act) return 'act:' + el.dataset.act + ':' + (el.dataset.id || '');
  if (el.id) return 'id:' + el.id;
  return null;
}
function findKey(root, k) {
  if (!k) return null;
  if (k.startsWith('fk:')) return root.querySelector(`[data-fk="${CSS.escape(k.slice(3))}"]`);
  if (k.startsWith('act:')) { const parts = k.split(':'); return $$(`[data-act="${parts[1]}"]`, root).find(e => (e.dataset.id || '') === parts.slice(2).join(':')) || null; }
  if (k.startsWith('id:')) return root.querySelector('#' + CSS.escape(k.slice(3)));
  return null;
}
function withFocus(root, fn) {

function say(msg) {

}
function toast(msg, o = {}) {
  const box = $('#toasts');
  const el = document.createElement('div');
  el.className = 'toast';
  el.innerHTML = `<span class="tt">${esc(msg)}</span>` + (o.undo ? `<button class="tb" type="button" aria-keyshortcuts="Meta+Z" data-tip="Desfazer · ${K('⌘Z')}">Desfazer</button>` : '') +
    (o.action ? `<button class="tb" type="button" data-x="1">${esc(o.action.label)}</button>` : '');
  if (o.undo) {
    S.ui.undo = o.undo; S.ui.undoAt = Date.now(); el._undo = o.undo;
    el.querySelector('button').addEventListener('click', runUndo);
  }
  if (o.action) el.querySelector('[data-x]').addEventListener('click', () => { el.remove(); o.action.run(); });
  box.appendChild(el);
  while (box.children.length > 3) box.firstChild.remove();
  /* 6 s, com pausa enquanto o ponteiro ou o foco estão no toast */
  let left = 6000, t0 = Date.now(), timer = null;
  const end = () => { if (o.undo && S.ui.undo === o.undo) S.ui.undo = null; if (RM()) { el.remove(); return; } el.classList.add('out'); setTimeout(() => el.remove(), 140); };
  const run = () => { t0 = Date.now(); timer = setTimeout(end, left); };
  const pause = () => { if (!timer) return; clearTimeout(timer); timer = null; left = Math.max(800, left - (Date.now() - t0)); };
  el.addEventListener('mouseenter', pause); el.addEventListener('focusin', pause);
  el.addEventListener('mouseleave', () => { if (!el.contains(document.activeElement) && !timer) run(); });
  el.addEventListener('focusout', e => { if (!el.contains(e.relatedTarget) && !el.matches(':hover') && !timer) run(); });
  run();
}

  const u = S.ui.undo;

  u();

}
function copyText(text, btn, done) {
  const ok = () => { if (done) done(true); };
  const fail = () => {
    if (btn) { const tgt = btn._copyTarget; if (tgt) { const r = document.createRange(); r.selectNodeContents(tgt); const s = getSelection(); s.removeAllRanges(); s.addRange(r); } }
    toast('Não deu para copiar daqui. O texto ficou selecionado: use ' + K('⌘C') + '.');
    if (done) done(false);
  };

    else fail();

function agoraTasks(pid) {
  const open = tasksOf(pid).filter(t => !isDone(t));
  const byDue = (a, b) => (a.due || '9').localeCompare(b.due || '9');
  const late = open.filter(isLate).sort(byDue);
  const first = S.columns.find(c => c.id !== S.doneCol);
  const mid = [];
  S.columns.filter(c => c.id !== S.doneCol && c !== first).forEach(c => open.filter(t => t.col === c.id && !isLate(t)).forEach(t => mid.push(t)));
  const soon = open.filter(t => first && t.col === first.id && !isLate(t) && t.due && dayDiff(t.due) <= 14).sort(byDue);
  const list = [...late, ...mid, ...soon].slice(0, 6);
  const rest = open.filter(t => !list.includes(t));
  const foot = [];
  S.columns.forEach(c => {
    const r = rest.filter(t => t.col === c.id);
    if (!r.length) return;
    if (r.length === 1 && r[0].due) foot.push(`Mais 1 em ${c.name}: ${r[0].title}, ${fmtShort(r[0].due)}`);
    else foot.push(`Mais ${r.length} em ${c.name}${r.every(t => !t.due) ? ' sem prazo' : ''}`);
  });
  return { list, foot: foot.length ? foot.join(' · ') + '.' : '' };
}

function flipPlay(m) {

/* =========================================================

   ========================================================= */
function indexHTML() {
  const r = S.ui.route;
  const pid = r.id, kind = r.kind || 'all', fsel = r.folder || 'all';
  const k = S.ui.idx, group = S.ui.idxGroup !== false;
  let items = itemsOf(pid);
  if (kind !== 'all') items = items.filter(x => x.k === kind);
  if (fsel === 'root') items = items.filter(x => !folderOf(x.it)); else if (fsel !== 'all') items = items.filter(x => x.it.folder === fsel);
  const rows = items.map(x => ({ x, title: x.it.title, edited: x.it.edited,
    snip: x.k === 'doc' ? firstText(x.it) : drawingText(x.it),
    n: x.k === 'doc' ? x.it.blocks.filter(b => b.t === 'task' && task(b.ref)).length : S.docs.filter(d => !d.trashed && !d.purged && d.blocks.some(b => b.t === 'drawing' && b.ref === x.it.id)).length }));
  rows.sort((a, b) => k.dir * (k.key === 'title' ? a.title.localeCompare(b.title, 'pt-BR') : k.key === 'n' ? a.n - b.n : k.key === 'kind' ? a.x.k.localeCompare(b.x.k) : a.edited.localeCompare(b.edited)));
  const th = (key, label, cls) => `<th scope="col" class="sc ${cls || ''}" ${k.key === key ? `aria-sort="${k.dir > 0 ? 'ascending' : 'descending'}"` : ''}><button data-act="idx-sort" data-id="${key}">${label}${k.key === key ? icon(k.dir > 0 ? 'up' : 'down', 14) : ''}</button></th>`;
  const tr = x => `<tr><td><button class="tbtn" data-act="${x.x.k === 'doc' ? 'open-doc' : 'open-drawing'}" data-id="${x.x.it.id}">${icon(kindIcon(x.x.k), 16, 'ico')}<span>${esc(x.title)}</span></button></td><td class="kd">${x.x.k === 'doc' ? 'Documento' : 'Desenho'}</td><td class="sn">${esc(trunc(x.snip, 80))}</td><td class="n">${fmtEdited(x.edited)}</td><td class="n">${x.n || '—'}</td></tr>`;
  let body = '';
  if (!rows.length) body = '<tr><td colspan="5" class="t3">Nada aqui.</td></tr>';

/* =========================================================
   Desenho: renderização esquemática em SVG
   ========================================================= */
function shapeBox(s) {
  if (s.k === 'text') { const w = Math.max(20, s.text.length * (s.small ? 8 : 8.4)); return { x: s.x, y: s.y - 16, w, h: 22 }; }
  if (s.k === 'line') return { x: Math.min(s.x1, s.x2), y: Math.min(s.y1, s.y2), w: Math.abs(s.x2 - s.x1), h: Math.abs(s.y2 - s.y1) };
  if (s.k === 'path') { const xs = s.pts.map(p => p[0]), ys = s.pts.map(p => p[1]); const x = Math.min(...xs), y = Math.min(...ys); return { x, y, w: Math.max(...xs) - x, h: Math.max(...ys) - y }; }
  if (s.k === 'arrow') return { x: 0, y: 0, w: 0, h: 0 };

}
function arrowPts(a, b) {
  const ac = { x: a.x + a.w / 2, y: a.y + a.h / 2 }, bc = { x: b.x + b.w / 2, y: b.y + b.h / 2 };
  const dx = bc.x - ac.x, dy = bc.y - ac.y, g = 7;
  if (Math.abs(dy) > Math.abs(dx) * 0.5 && Math.abs(dy) > 30) {
    const dn = dy > 0;
    return [ac.x, dn ? a.y + a.h + g : a.y - g, bc.x, dn ? b.y - g : b.y + b.h + g];
  }
  const rt = dx > 0;
  return [rt ? a.x + a.w + g : a.x - g, ac.y, rt ? b.x - g : b.x + b.w + g, bc.y];
}
function shapeSVG(s, byId, mid) {
  const n = v => Math.round(v * 10) / 10;
  switch (s.k) {
    case 'rect': return `<g data-sid="${s.id}"><rect class="dgs fillb ${s.dashed ? 'dash' : ''}" x="${n(s.x)}" y="${n(s.y)}" width="${n(s.w)}" height="${n(s.h)}" rx="8"/>${s.text ? `<text class="dgt" x="${n(s.x + s.w / 2)}" y="${n(s.y + s.h / 2)}" text-anchor="middle" dominant-baseline="central">${esc(s.text)}</text>` : ''}</g>`;
    case 'diamond': { const cx = s.x + s.w / 2, cy = s.y + s.h / 2; return `<g data-sid="${s.id}"><polygon class="dgs fillb" points="${n(cx)},${n(s.y)} ${n(s.x + s.w)},${n(cy)} ${n(cx)},${n(s.y + s.h)} ${n(s.x)},${n(cy)}"/>${s.text ? `<text class="dgt" x="${n(cx)}" y="${n(cy)}" text-anchor="middle" dominant-baseline="central">${esc(s.text)}</text>` : ''}</g>`; }
    case 'text': { const b = shapeBox(s); return `<g data-sid="${s.id}"><rect class="hitbox" x="${n(b.x)}" y="${n(b.y)}" width="${n(b.w)}" height="${n(b.h)}"/><text class="dgt ${s.small ? 'small' : ''}" x="${n(s.x)}" y="${n(s.y)}">${esc(s.text)}</text></g>`; }
    case 'arrow': {
      const a = byId[s.from], b = byId[s.to];
      if (!a || !b) return '';
      const [x1, y1, x2, y2] = arrowPts(shapeBox(a), shapeBox(b));
      return `<g data-sid="${s.id}"><line class="hitline" x1="${n(x1)}" y1="${n(y1)}" x2="${n(x2)}" y2="${n(y2)}"/><line class="dga ${s.dashed ? 'dash' : ''}" x1="${n(x1)}" y1="${n(y1)}" x2="${n(x2)}" y2="${n(y2)}" marker-end="url(#${mid})"/></g>`;
    }
    case 'line': return `<g data-sid="${s.id}"><line class="hitline" x1="${n(s.x1)}" y1="${n(s.y1)}" x2="${n(s.x2)}" y2="${n(s.y2)}"/><line class="dga" x1="${n(s.x1)}" y1="${n(s.y1)}" x2="${n(s.x2)}" y2="${n(s.y2)}" marker-end="url(#${mid})"/></g>`;
    case 'path': { const pts = s.pts.map(p => n(p[0]) + ',' + n(p[1])).join(' '); return `<g data-sid="${s.id}"><polyline class="hitline" points="${pts}"/><polyline class="dgs" points="${pts}"/></g>`; }
  }

}
function drawingSVG(d, o = {}) {
  const mid = uid('ah');
  const byId = {};
  d.shapes.forEach(s => { byId[s.id] = s; });
  let body = d.shapes.map(s => shapeSVG(s, byId, mid)).join('');
  if (o.sel && byId[o.sel] && byId[o.sel].k !== 'arrow') {
    const b = shapeBox(byId[o.sel]);

  const grid = o.interactive ? `<pattern id="${mid}g" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" class="dg-grid"/></pattern>` : '';
  const gridRect = o.interactive ? `<rect x="-3000" y="-3000" width="7000" height="7000" fill="url(#${mid}g)"/>` : '';
  const vb = o.viewBox || `0 0 ${d.W} ${d.H}`;
  return `<svg viewBox="${vb}" preserveAspectRatio="${o.slice ? 'xMidYMid slice' : 'xMidYMid meet'}" xmlns="http://www.w3.org/2000/svg" ${o.interactive ? '' : 'aria-hidden="true" focusable="false"'}><defs><marker id="${mid}" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="dgh"/></marker>${grid}</defs>${gridRect}${body}</svg>`;
}

/* ---------- editor em blocos (simulação do BlockNote) ---------- */
function ownerOf(el) {

  if (!root) return null;
  const [kind, id] = root.dataset.owner.split(':');
  const ent = kind === 'doc' ? docAny(id) : taskAny(id);

const blockById = (o, bid) => o.blocks.find(b => b.id === bid);
const ctxFor = o => o.kind === 'doc' ? { kind: 'doc', doc: o.ent } : { kind: 'task' };

}

}
function openSlash(ed, o, b) {
  closePops();

  const pop = document.createElement('div');
  pop.className = 'pop slash';

  pop.innerHTML = '<ul role="listbox" id="slash-list" aria-label="Blocos"></ul>';
  $('#pop-layer').appendChild(pop);

/* ---------- barra de formatação ---------- */
const FMT = { range: null, linkMode: false };
function updateFmtBar() {
  const bar = $('#fmt-bar');
  if (bar.contains(document.activeElement)) return;
  const s = getSelection();
  if (!s.rangeCount || s.isCollapsed) { hideFmt(); return; }
  const r = s.getRangeAt(0);
  const node = r.commonAncestorContainer.nodeType === 1 ? r.commonAncestorContainer : r.commonAncestorContainer.parentElement;
  const ed = node && node.closest('.ed');
  if (!ed || !ed.closest('.editor') || !s.toString().trim()) { hideFmt(); return; }
  const o = ownerOf(ed);
  FMT.range = r.cloneRange();
  FMT.linkMode = false;
  bar.innerHTML = `
    <button type="button" data-fmt="bold" aria-label="Negrito (${K('⌘B')})">${icon('bold', 16)}</button>
    <button type="button" data-fmt="italic" aria-label="Itálico (${K('⌘I')})">${icon('italic', 16)}</button>
    <button type="button" data-fmt="code" aria-label="Código">${icon('code', 16)}</button>
    <button type="button" data-fmt="link" aria-label="Link">${icon('link', 16)}</button>
    ${o && o.kind === 'doc' ? `<span class="vr" aria-hidden="true"></span><button type="button" class="tk" data-fmt="task" aria-label="Criar tarefa a partir da seleção (${K('⌘⌥T')})">Criar tarefa <kbd>${K('⌘⌥T')}</kbd></button>` : ''}`;
  bar.hidden = false;
  const rect = r.getBoundingClientRect();
  const bw = bar.offsetWidth, bh = bar.offsetHeight;
  let top = rect.top - bh - 10;
  if (top < 8) top = rect.bottom + 10;
  bar.style.top = top + 'px';
  bar.style.left = clamp(rect.left + rect.width / 2 - bw / 2, 72, window.innerWidth - bw - 8) + 'px';
}
function hideFmt() { const bar = $('#fmt-bar'); if (!bar.hidden) { bar.hidden = true; bar.innerHTML = ''; } }
function restoreRange() {
  if (!FMT.range) return null;
  const s = getSelection(); s.removeAllRanges(); s.addRange(FMT.range);
  const node = FMT.range.commonAncestorContainer;
  const ed = (node.nodeType === 1 ? node : node.parentElement).closest('.ed');

}
function fmtAction(kind) {
  if (kind === 'task') { restoreRange(); hideFmt(); taskFromSelection(); return; }
  if (kind === 'link') {
    const bar = $('#fmt-bar');
    bar.innerHTML = `<label class="sr-only" for="fmt-link">Endereço do link</label><input id="fmt-link" type="url" placeholder="https://" autocomplete="off"><button type="button" data-fmt="link-ok">Aplicar</button>`;
    const inp = $('#fmt-link');
    inp.focus();
    inp.addEventListener('keydown', ev => {
      if (ev.key === 'Enter') { ev.preventDefault(); fmtAction('link-ok'); }
      if (ev.key === 'Escape') { ev.preventDefault(); ev.stopPropagation(); hideFmt(); restoreRange(); }
    });
    return;
  }
  if (kind === 'link-ok') {
    const url = ($('#fmt-link') || {}).value || '';
    hideFmt();
    const ed = restoreRange();
    if (url.trim()) document.execCommand('createLink', false, url.trim());
    if (ed) ed.dispatchEvent(new InputEvent('input', { bubbles: true }));
    return;
  }
  const ed = restoreRange();
  if (kind === 'bold') document.execCommand('bold');
  if (kind === 'italic') document.execCommand('italic');
  if (kind === 'code') { const t = getSelection().toString(); document.execCommand('insertHTML', false, '<code>' + esc(t) + '</code>'); }

function editShapeLabel(s) {
  if (!s || !('text' in s)) return;
  const svg = $('#dg-canvas'), frame = $('.dg-frame');
  const g = svg.querySelector(`[data-sid="${s.id}"]`);

  inp.style.top = (r.top - fr.top + r.height / 2 - 15) + 'px';
  inp.style.width = '180px';

  inp.focus(); inp.select();
  let done = false;
  const commit = ok => {

    inp.remove(); renderCanvas(); svg.focus({ preventScroll: true });

    if (ev.key === 'Enter') { ev.preventDefault(); commit(true); }

function canvasKey(e) {
  const d = drw(DG.id);
  if (!d) return false;
  const mod = e.metaKey || e.ctrlKey;
  if (mod && e.key.toLowerCase() === 'z') { e.preventDefault(); if (e.shiftKey) dgRedo(); else dgUndo(); return true; }
  if (mod || e.altKey) return false;
  const t = TOOLS.find(x => x.key.toLowerCase() === e.key.toLowerCase());
  if (t) { e.preventDefault(); dgSetTool(t.k); return true; }
  if (e.key === 'Escape' && DG.tool !== 'select') { e.preventDefault(); e.stopPropagation(); dgSetTool('select'); return true; }
  const s = DG.sel && d.shapes.find(x => x.id === DG.sel);
  if (!s) {
    if (e.key === 'Tab' || e.key.startsWith('Arrow')) {
      if (e.key.startsWith('Arrow')) { e.preventDefault(); const f = d.shapes.find(x => x.k !== 'arrow'); if (f) { DG.sel = f.id; renderCanvas(); say('Selecionado: ' + (f.text || f.k)); } return true; }
    }
    return false;
  }
  if (e.key === 'Delete' || e.key === 'Backspace') {
    e.preventDefault(); dgPush();
    d.shapes = d.shapes.filter(x => x.id !== s.id && x.from !== s.id && x.to !== s.id);
    DG.sel = null; renderCanvas(); markDirty(d.id); say('Forma removida');
    return true;
  }
  if (e.key === 'Enter') { e.preventDefault(); editShapeLabel(s); return true; }
  const step = e.shiftKey ? 32 : 8;
  const mv = { ArrowLeft: [-step, 0], ArrowRight: [step, 0], ArrowUp: [0, -step], ArrowDown: [0, step] }[e.key];
  if (mv && s.k !== 'arrow') { e.preventDefault(); dgPush(); moveShape(s, mv[0], mv[1]); renderCanvas(); markDirty(d.id); return true; }
  if (e.key === 'Escape' && DG.sel) { e.preventDefault(); e.stopPropagation(); DG.sel = null; renderCanvas(); say('Nada selecionado'); return true; }
  return false;
}

function importExcalidraw(file) {
  const r = new FileReader();
  r.onload = () => {
    let shapes = [];
    try {
      const j = JSON.parse(r.result);
      const els = (j.elements || []).filter(x => !x.isDeleted);
      const minX = Math.min(...els.map(x => x.x)), minY = Math.min(...els.map(x => x.y));
      els.forEach(x => {
        const X = x.x - minX + 40, Y = x.y - minY + 40;
        if (x.type === 'rectangle' || x.type === 'ellipse') shapes.push({ id: uid('s'), k: 'rect', x: X, y: Y, w: x.width, h: x.height, text: '' });
        else if (x.type === 'diamond') shapes.push({ id: uid('s'), k: 'diamond', x: X, y: Y, w: x.width, h: x.height, text: '' });
        else if (x.type === 'text') shapes.push({ id: uid('s'), k: 'text', x: X, y: Y + 16, text: x.text || '' });
        else if ((x.type === 'arrow' || x.type === 'line') && x.points && x.points.length > 1) { const a = x.points[0], b = x.points[x.points.length - 1]; shapes.push({ id: uid('s'), k: 'line', x1: X + a[0], y1: Y + a[1], x2: X + b[0], y2: Y + b[1] }); }
      });
    } catch (err) { shapes = []; }
    const cur = drwAny(S.ui.route.id);
    const pid = cur && cur.project ? cur.project : S.ui.project;
    const d = newDrawingRecord(pid, file.name.replace(/\.excalidraw$/i, '') || 'Desenho importado');
    d.shapes = shapes;
    if (shapes.length) { const bx = shapes.map(shapeBox); d.W = Math.max(600, ...bx.map(b => b.x + b.w + 40)); d.H = Math.max(360, ...bx.map(b => b.y + b.h + 40)); }
    go({ s: 'drawing', id: d.id });
    toast(shapes.length ? 'Importado como outro desenho.' : 'O arquivo não tinha formas legíveis. Criado um desenho vazio.');
  };
  r.readAsText(file);
}

      case 'code': line = '```\n' + strip(b.html) + '\n```'; break;
      case 'task': { const t = task(b.ref); line = t ? `[${t.title}](https://[SEU-DOMÍNIO]/tarefa/${t.id})` : '_Tarefa indisponível_'; break; }

  while (b < chars.length && starts[b] < i + nq.length) b++;

}
