function moveColumn(cid, dir) {
  const i = colIdx(cid), j = i + dir;
  if (j < 0 || j >= S.columns.length) return;
  [S.columns[i], S.columns[j]] = [S.columns[j], S.columns[i]];
  refresh();
  const h = $('#kh-' + cid); if (h) h.focus();
  say(`Coluna ${col(cid).name} na posição ${j + 1} de ${S.columns.length}`);
}
function addColumn() {
  if (S.ui.route.s !== 'board') go({ s: 'board', id: S.ui.project });
  const c = { id: uid('c'), name: 'Nova coluna' };
  const di = S.columns.findIndex(x => x.id === S.doneCol);
  S.columns.splice(di === S.columns.length - 1 ? di : S.columns.length, 0, c);
  rerenderScreen();
  renameColumn(c.id);
}
function renameColumn(cid) {
  const btn = $('#kh-' + cid);
  const c = col(cid);
  if (!btn || !c) return;
  const inp = document.createElement('input');
  inp.className = 'kcol-rename';
  inp.value = c.name;
  inp.setAttribute('aria-label', 'Nome da coluna');
  btn.replaceWith(inp);
  inp.scrollIntoView({ block: 'nearest', inline: 'nearest' });
  inp.focus(); inp.select();
  let done = false;
  const commit = ok => {
    if (done) return;
    done = true;
    const v = inp.value.replace(/\s+/g, ' ').trim();
    if (ok && v && v !== c.name) { c.name = v; say('Coluna renomeada para ' + v); }
    refresh();
    const nb = $('#kh-' + cid); if (nb) nb.focus();
  };
  inp.addEventListener('keydown', e => {
    if (e.key === 'Enter') { e.preventDefault(); commit(true); }
    if (e.key === 'Escape') { e.preventDefault(); e.stopPropagation(); commit(false); }
  });
  inp.addEventListener('blur', () => commit(true));
}

  if (lk === 'n') { e.preventDefault(); const f = isFolder ? fid : (t.closest('.fold') ? t.closest('.fold').dataset.fold : null); newMenu(t, f); return true; }
  if (lk === 'g' || !/[a-z0-9à-ú]/i.test(lk)) return false;
  /* digitação: vai à próxima linha que começa com o que foi digitado */
  const now = Date.now();
  TA.s = now - TA.t < 700 ? TA.s + lk : lk; TA.t = now;
  const start = TA.s.length > 1 ? i : i + 1;
  const order = rows.slice(start).concat(rows.slice(0, start));
  const hit = order.find(r => norm((r.querySelector('.nm') || r).textContent).startsWith(norm(TA.s)));
  if (hit) { e.preventDefault(); focusRow(hit); return true; }
  return false;
}

/* ---------- arrastar na árvore ---------- */
const TDND = { kind: null, id: null, ik: null, timer: null, over: null, dest: undefined, before: null };
function sbDropLine(x, y, w) {
  let l = $('#sb-dropline');
  if (!l) { l = document.createElement('div'); l.id = 'sb-dropline'; l.className = 'sb-dropline'; document.body.appendChild(l); }
  Object.assign(l.style, { left: x + 'px', top: (y - 1) + 'px', width: w + 'px', display: 'block' });
}
function treeDndClear() {
  $$('#sb-body .drop-target').forEach(r => r.classList.remove('drop-target'));
  const l = $('#sb-dropline'); if (l) l.style.display = 'none';
  clearTimeout(TDND.timer); TDND.timer = null; TDND.over = null;
}
function treeDragStart(e, row) {
  TDND.kind = row.classList.contains('tr-folder') ? 'folder' : 'item';
  TDND.id = row.dataset.id; TDND.ik = row.dataset.kind || null;
  e.dataTransfer.effectAllowed = 'move';
  e.dataTransfer.setData('text/plain', row.dataset.id);
  setTimeout(() => row.classList.add('dragging'), 0);
}
function treeDragOver(e) {
  const body = $('#sb-body');
  if (!body.contains(e.target)) { treeDndClear(); return false; }
  const row = e.target.closest('[role="treeitem"], #sb-items-h, .fold-empty');
  const br = body.getBoundingClientRect();
  treeDndClear();
  TDND.dest = undefined; TDND.before = null;
  if (TDND.kind === 'folder') {
    const fr = e.target.closest('.fold');
    if (!fr || !row || !row.classList.contains('tr-folder')) { e.dataTransfer.dropEffect = 'none'; return false; }
    const r = row.getBoundingClientRect(), after = e.clientY > r.top + r.height / 2;
    const folds = $$('#sb-body .sb-tree > .fold');
    const idx = folds.indexOf(fr) + (after ? 1 : 0);
    TDND.before = folds[idx] ? folds[idx].dataset.fold : null; TDND.dest = 'reorder';
    sbDropLine(br.left + 52, after ? fr.getBoundingClientRect().bottom : r.top, 240 - 52);
    e.preventDefault(); e.dataTransfer.dropEffect = 'move';
    return true;
  }
  if (!row) {
    if (e.target.closest('.sb-tree') || e.target === body) { TDND.dest = null; e.preventDefault(); return true; }
    return false;
  }
  if (row.id === 'sb-items-h') { TDND.dest = null; row.classList.add('drop-target'); e.preventDefault(); return true; }
  if (row.classList.contains('tr-folder')) {
    const fid = row.dataset.id;
    TDND.dest = fid; row.classList.add('drop-target'); TDND.over = fid;
    if (row.getAttribute('aria-expanded') !== 'true') TDND.timer = setTimeout(() => { setOpen(S.ui.project, fid, true); renderSidebar(); }, 600);
    e.preventDefault(); e.dataTransfer.dropEffect = 'move';
    return true;
  }
  const fold = row.closest('.fold');
  TDND.dest = fold ? fold.dataset.fold : (row.classList.contains('fold-empty') ? null : null);
  if (row.classList.contains('fold-empty')) TDND.dest = row.closest('.fold').dataset.fold;
  const r = row.getBoundingClientRect(), after = e.clientY > r.top + r.height / 2;
  const x = TDND.dest ? 76 : 52;
  sbDropLine(br.left + x, after ? r.bottom : r.top, 240 - x);
  e.preventDefault(); e.dataTransfer.dropEffect = 'move';
  return true;
}
function treeDrop(e) {
  const dest = TDND.dest, kind = TDND.kind, id = TDND.id, ik = TDND.ik, before = TDND.before;
  treeDndClear();
  TDND.kind = null;
  if (dest === undefined) return false;
  e.preventDefault();
  if (kind === 'folder') { if (dest === 'reorder') placeFolderAt(id, before); return true; }
  moveToFolder(ik, id, dest);
  return true;
}

/* =========================================================
   Eventos
   ========================================================= */
function wire() {
  document.addEventListener('keydown', onKeyDown);
  document.addEventListener('click', e => {
    const fb = e.target.closest('#fmt-bar button');
    if (fb) { fmtAction(fb.dataset.fmt); return; }
    const h = e.target.closest('[data-title]');
    if (h && !h.isContentEditable) { startTitleEdit(h, e); return; }
    const el = e.target.closest('[data-act]');
    if (!el || el.closest('.menu')) return;
    const fn = ACT[el.dataset.act];
    if (fn) fn(el, e);
  });
  $('#fmt-bar').addEventListener('mousedown', e => { if (e.target.tagName !== 'INPUT') e.preventDefault(); });
  document.addEventListener('focusout', e => {
    if (e.target.id === 'fold-in' && S.ui.folderEdit && !S.ui.folderEdit.busy) setTimeout(() => { if (S.ui.folderEdit && !$('#fold-in:focus')) finishFolderEdit(true, true); }, 0);
  });
  document.addEventListener('input', e => {
    const t = e.target;
    if (!['cmd-input', 'tag-in', 'sw-in', 'sb-filter'].includes(t.id)) lastTyping = Date.now();
    if (t.id === 'fold-in' && S.ui.folderEdit) { S.ui.folderEdit.value = t.value; if (S.ui.folderEdit.err) { S.ui.folderEdit.err = ''; const er = $('#fold-err'); if (er) er.remove(); } return; }
    if (t.classList && t.classList.contains('ed')) { onEdInput(e); return; }
    if (t.dataset && t.dataset.title) { titleInput(t); return; }
    if (t.id === 'insp-title' && S.ui.insp && S.ui.insp.mode === 'task') {
      const tk = task(S.ui.insp.id);
      tk.title = t.value.replace(/\s*\n\s*/g, ' ');
      autosize(t); markDirty(tk.id); refreshSoon();
      return;
    }
    if (t.id === 'new-title' && S.ui.insp && S.ui.insp.mode === 'new') { S.ui.insp.draft.title = t.value; autosize(t); const er = $('#new-title-err'); if (er) er.hidden = true; t.removeAttribute('aria-invalid'); return; }
    if (t.id === 'sb-filter') { S.ui.sbFilter = t.value; renderSidebar(); return; }
    if (t.id === 'cmd-input') { CMD.idx = 0; cmdRender(); }
  });
  document.addEventListener('change', e => {
    const t = e.target;
    if (t.classList.contains('cbx') && t.closest('.editor')) { onCheck(e); return; }
    if (t.id === 'new-embed' && S.ui.insp && S.ui.insp.mode === 'new') { S.ui.insp.draft.embed = t.checked; return; }
    if (t.name === 'theme') { setTheme(t.value); return; }
    if (t.id === 'file-md' && t.files[0]) {
      const f = t.files[0];
      const rd = new FileReader();
      rd.onload = () => {
        const { title, blocks } = mdToBlocks(String(rd.result));
        const pid = S.ui.project;
        const d = { id: uid('d'), title: title || f.name.replace(/\.(md|markdown|txt)$/i, ''), project: pid, edited: nowStamp(), created: TODAY, pinned: false, blocks };
        S.docs.push(d);
        go({ s: 'doc', id: d.id });
        markDirty(d.id);
        toast('Importado como outro documento. Links do arquivo continuam links comuns.');
      };
      rd.readAsText(f);
      t.value = '';
    }
    if (t.id === 'file-ex' && t.files[0]) { importExcalidraw(t.files[0]); t.value = ''; }
  });
  document.addEventListener('submit', e => {
    if (e.target.id === 'pw-form') { e.preventDefault(); pwSubmit(); }
    if (e.target.id === 'new-form') { e.preventDefault(); createFromDraft(); }
  });
  document.addEventListener('focusin', e => {
    const t = e.target;
    if (t.classList && t.classList.contains('card-open')) { S.ui.board.focus = t.dataset.id; $$('#board .card-open').forEach(b => { b.tabIndex = b === t ? 0 : -1; }); }
    if (t.dataset && t.dataset.tip && t.matches(':focus-visible')) showTip(t);
  });
  document.addEventListener('focusout', e => {
    const t = e.target;
    if (t.dataset && t.dataset.title && t.isContentEditable) titleCommit(t);
    if (t.dataset && t.dataset.tip) hideTip();
  });
  document.addEventListener('mouseover', e => { const t = e.target.closest && e.target.closest('[data-tip]'); if (t) showTip(t); });
  document.addEventListener('mouseout', e => { const t = e.target.closest && e.target.closest('[data-tip]'); if (t && !t.contains(e.relatedTarget)) hideTip(); });
  document.addEventListener('scroll', e => { if (e.target && e.target.closest && e.target.closest('#screen')) persist(); }, true);
  let fmtRaf = 0;
  document.addEventListener('selectionchange', () => { cancelAnimationFrame(fmtRaf); fmtRaf = requestAnimationFrame(() => { updateFmtBar(); if (SL.open && document.activeElement === SL.ed) updateSlash(); }); });
  document.addEventListener('pointerdown', e => {
    hideTip();
    const t = e.target;
    if (MENU.stack.length && !t.closest('.menu')) { const root = MENU.stack[0]; if (!(root.anchor && root.anchor.contains && root.anchor.contains(t))) closeMenus(false); }
    if (hasPop() && !t.closest('.pop') && !(POP.anchor && POP.anchor.contains && POP.anchor.contains(t))) closePops(false);
    if (!t.closest('#fmt-bar') && !t.closest('.ed')) hideFmt();
    if (S.ui.sbOverlay && S.ui.sbOverlayOpen && !t.closest('#sidebar') && !t.closest('.pop') && !t.closest('.menu')) { S.ui.sbOverlayOpen = false; renderSidebar(); }
    if (t.closest('#dg-canvas')) dgPointerDown(e);
    const hd = t.closest('.d-handle');
    if (hd) { e.preventDefault(); HDRAG.on = true; HDRAG.y = e.clientY; HDRAG.f = S.ui.drawerFrac; if (hd.setPointerCapture) hd.setPointerCapture(e.pointerId); }
  });
  document.addEventListener('pointermove', e => {
    if (DG.drag) dgPointerMove(e);
    if (HDRAG.on) { const wh = $('#work').clientHeight; setDrawerFrac(HDRAG.f + (HDRAG.y - e.clientY) / wh); }
  });
  document.addEventListener('pointerup', () => { if (DG.drag) dgPointerUp(); if (HDRAG.on) { HDRAG.on = false; say(`Gaveta em ${Math.round(S.ui.drawerFrac * 100)}% da altura`); } });
  document.addEventListener('dblclick', e => {
    const fn = e.target.closest && e.target.closest('#sb-body .tr-folder:not(.editing) .nm');
    if (fn) { e.preventDefault(); startFolderRename(fn.closest('.tr-folder').dataset.id); return; }
    const g = e.target.closest && e.target.closest('#dg-canvas [data-sid]');
    if (!g) return;
    const d = drw(DG.id);
    const s = d && d.shapes.find(x => x.id === g.dataset.sid);
    if (s && 'text' in s) { DG.sel = s.id; renderCanvas(); editShapeLabel(s); }
  });
  document.addEventListener('contextmenu', e => {
    const it = e.target.closest('#sb-body .sb-item[data-id], #pop-layer .treepop .sb-item[data-id]');
    if (it) { e.preventDefault(); if (it.classList.contains('tr-folder')) folderMenu(it, it.dataset.id); else if (it.dataset.kind) itemMenu(it, it.dataset.id, it.dataset.kind); return; }
    const c = e.target.closest('#board .card');
    if (c) { e.preventDefault(); cardMenu(c.dataset.id, c.querySelector('.card-more')); }
  });
  document.addEventListener('dragstart', e => {
    const trow = e.target.closest && e.target.closest('#sb-body [role="treeitem"][draggable="true"]');
    if (trow) { treeDragStart(e, trow); return; }
    const card = e.target.closest && e.target.closest('#board .card[data-id]');
    if (card) {
      DND.id = card.dataset.id; DND.kind = 'card';
      e.dataTransfer.effectAllowed = 'move';
      e.dataTransfer.setData('text/plain', card.dataset.id);
      setTimeout(() => card.classList.add('dragging'), 0);
      return;
    }
    e.preventDefault();
  });
  document.addEventListener('dragover', e => {
    if (TDND.kind) { treeDragOver(e); return; }
    if (DND.kind !== 'card') return;
    const kc = e.target.closest && e.target.closest('.kcol');
    if (!kc) return;
    e.preventDefault();
    const body = kc.querySelector('.kcol-body');
    $$('.kcol.drop').forEach(c => { if (c !== kc) c.classList.remove('drop'); });
    kc.classList.add('drop');
    const { before } = dropIndex(body, e.clientY);
    if (!DND.ind) { DND.ind = document.createElement('div'); DND.ind.className = 'drop-ind'; }
    if (before) before.parentNode.insertBefore(DND.ind, before); else body.appendChild(DND.ind);
  });
  document.addEventListener('drop', e => {
    if (TDND.kind) { treeDrop(e); return; }
    if (DND.kind === 'card') {
      const kc = e.target.closest && e.target.closest('.kcol');
      if (kc) {
        e.preventDefault();
        const { i } = dropIndex(kc.querySelector('.kcol-body'), e.clientY);
        const id = DND.id;
        dndCleanup();
        moveTaskTo(id, kc.dataset.col, i);
        const b = $(`[data-fk="card-${id}"]`); if (b) b.focus({ preventScroll: true });
      }
    }
    DND.kind = null;
  });
  document.addEventListener('dragend', () => { dndCleanup(); DND.kind = null; treeDndClear(); TDND.kind = null; $$('#sb-body .dragging').forEach(r => r.classList.remove('dragging')); });
  const cmd = $('#cmd');
  cmd.addEventListener('cancel', e => { e.preventDefault(); closeCmd(true); });
  cmd.addEventListener('click', e => {
    const o = e.target.closest('.cmd-opt');
    if (o) { cmdRun(+o.dataset.i); return; }
    if (!e.target.closest('.cmd-panel')) closeCmd(true);
  });
  cmd.addEventListener('mousemove', e => {
    const o = e.target.closest('.cmd-opt');
    if (o && +o.dataset.i !== CMD.idx) { CMD.idx = +o.dataset.i; $$('.cmd-opt', cmd).forEach(x => x.setAttribute('aria-selected', String(x === o))); $('#cmd-input').setAttribute('aria-activedescendant', o.id); }
  });
  $('#cmd-input').addEventListener('keydown', e => {
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
      e.preventDefault();
      if (!CMD.items.length) return;
      CMD.idx = (CMD.idx + (e.key === 'ArrowDown' ? 1 : -1) + CMD.items.length) % CMD.items.length;
      cmdRender();
    } else if (e.key === 'Enter') { e.preventDefault(); cmdRun(CMD.idx); }
    else if (e.key === 'Tab') e.preventDefault();
  });
  window.addEventListener('resize', () => {
    closeMenus(false); closePops(false); hideFmt(); hideTip();
    const narrow = innerWidth < 1100;
    if (narrow !== S.ui.sbOverlay) { S.ui.sbOverlay = narrow; S.ui.sbOverlayOpen = false; applySbWidth(); renderSidebar(); }
    applyDrawerHeight();
  });
}

function detectSmcp() {
  try {
    const m = document.createElement('span');
    m.style.cssText = 'position:absolute;left:-9999px;top:0;visibility:hidden;white-space:nowrap;font:600 12px/16px var(--f-ui);font-synthesis:none';
    m.textContent = 'Documentos Desenhos Agora';
    document.body.appendChild(m);
    const w1 = m.getBoundingClientRect().width;
    m.style.fontVariantCaps = 'all-small-caps';
    const w2 = m.getBoundingClientRect().width;
    m.remove();
    document.documentElement.classList.toggle('no-smcp', Math.abs(w1 - w2) < 0.5);
  } catch (e) { /* sem medida, fica o versalete pedido */ }
}
function boot() {
  const saved = loadPersist();
  initState(saved ? { collapsed: saved.collapsed, sec: saved.sec, theme: saved.theme } : null);
  S.ui.sbOverlay = innerWidth < 1100;
  applyTheme();
  applySbWidth();
  wire();
  const h = (location.hash || '').slice(1);
  const restored = saved && saved.route && routeValid(saved.route);
  S.ui.route = restored ? saved.route : { s: 'doc', id: 'd1' };
  S.ui.project = routeProject(S.ui.route) || 'tf';
  renderAll();
  const sc = $('#screen [data-sk]');
  if (sc) {
    if (restored) sc.scrollTop = saved.scroll || 0;
    else if (S.ui.route.s === 'doc') { const el = $('#doc-editor [data-bid="d1nav"]'); if (el) sc.scrollTop += el.getBoundingClientRect().top - sc.getBoundingClientRect().top - 8; }
  }
  focusH1();
  if (h && HASH[h]) protoGo(HASH[h]);
  try { document.fonts.ready.then(detectSmcp); } catch (e) { detectSmcp(); }
}
boot();
